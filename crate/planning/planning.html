  <script>
    (function() {
      var key = "ik_site_theme_v1";
      var stored = null;
      try { stored = localStorage.getItem(key); } catch (e) {}
      var theme = (stored === "dark" || stored === "light")
        ? stored
        : ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>

<style id="ik-site-settings-css">
.ik-site-nav{ position: relative; }
.ik-site-nav__actions{
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
}
.ik-floating-settings{
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 100100;
}
.ik-gear-btn{
  appearance: none;
  border: 1px solid rgba(0,0,0,.14);
  background: #fff;
  color: rgba(0,0,0,.86);
  width: 42px;
  height: 42px;
  padding: 0;
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  border-radius: 0;
  transition: transform .18s ease, border-color .18s ease, opacity .18s ease;

}
.ik-gear-btn:hover{

}
.ik-settings-panel{

  top: 68px;
  right: 16px;
  z-index: 100101;
  width: min(320px, calc(100vw - 24px));
  border: 1px solid rgba(0,0,0,.18);
  background: rgba(255,255,255,.98);

  justify-content: space-between;

.ik-settings-panel__title{

  <script type="module">
    let bootError = null;
    try {
      const { initPlanningCloud } = await import('./js/planning_cloud.js');
      try {
        await initPlanningCloud();
      } catch (error) {
        console.error('planning cloud init failed', error);
      }
      await import('./planning.js');
    } catch (error) {
      bootError = error;
      console.error('planning boot failed', error);
    } finally {
      if (window.IKLoading) window.IKLoading.done();
    }

    if (bootError) {
      const view = document.getElementById('boardView');
      if (view) {
        view.hidden = false;
        view.innerHTML = '<div style="font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:.78;">planning boot failed. reload page.</div>';
      }
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var backBtn = document.getElementById('ikBackBtn');
      var viewSelect = document.getElementById('viewSelect');
      var modal = document.getElementById('modal');

      var ignoreNextHashChange = false;
      var applyFromHashInProgress = false;

      function safeBrowserBack(fallbackHref){
        if(window.history.length <= 1){
          window.location.href = fallbackHref;
          return;
        }

        var currentHref = window.location.href;
        var navigated = false;
        var markNavigated = function(){ navigated = true; };

        window.addEventListener('pagehide', markNavigated, { once: true });
        window.addEventListener('popstate', markNavigated, { once: true });

        window.history.back();

        window.setTimeout(function(){
          if(navigated) return;
          if(window.location.href === currentHref){
            window.location.href = fallbackHref;
          }
        }, 450);
      }

      function readViewFromHash(){
        var raw = String(window.location.hash || '').replace('#', '').trim().toLowerCase();
        if(raw === 'board') return raw;
        return '';
      }

      function writeHashForView(view, replace){
        var next = '#' + view;
        if(window.location.hash === next) return;

        if(replace){
          var base = window.location.pathname + window.location.search + next;
          window.history.replaceState(window.history.state, '', base);
          return;
        }

        ignoreNextHashChange = true;
        window.location.hash = view;
      }

      function closeOpenModal(){
        if(!modal || modal.hidden) return false;
        var closeBtn = modal.querySelector('.icon-btn[data-close], [data-close]');
        if(closeBtn){
          closeBtn.click();
        } else {
          modal.hidden = true;
        }
        return true;
      }

      if(viewSelect){
        var hashView = readViewFromHash();
        if(hashView && hashView !== viewSelect.value){
          applyFromHashInProgress = true;
          viewSelect.value = hashView;
          viewSelect.dispatchEvent(new Event('change', { bubbles: true }));
          applyFromHashInProgress = false;
        } else {
          writeHashForView(viewSelect.value || 'board', true);
        }

        viewSelect.addEventListener('change', function(){
          if(applyFromHashInProgress) return;
          writeHashForView(viewSelect.value || 'board', false);
        });

        window.addEventListener('hashchange', function(){
          if(ignoreNextHashChange){
            ignoreNextHashChange = false;
            return;
          }

          var nextView = readViewFromHash();
          if(!nextView || nextView === viewSelect.value) return;

          applyFromHashInProgress = true;
          viewSelect.value = nextView;
          viewSelect.dispatchEvent(new Event('change', { bubbles: true }));
          applyFromHashInProgress = false;
        });
      }

      if(backBtn){
        backBtn.addEventListener('click', function(event){
          event.preventDefault();
          if(closeOpenModal()) return;
          if(window.IKLoading && typeof window.IKLoading.leave === 'function'){
            window.IKLoading.leave(function(){ safeBrowserBack('/item_key/'); });
          } else {
            safeBrowserBack('/item_key/');
          }
        });
      }
    });
  </script>

  const SELECTOR_RULES = {
    planning: [
      { selector: '.planning-title .kicker', text: { ru: 'модуль', en: 'module' } },
      { selector: '.planning-title h1', text: { ru: 'планирование', en: 'planning' } },

      { selector: '#scopePersonal', text: { ru: 'Личные', en: 'Personal' } },
      { selector: '#scopeShared', text: { ru: 'Общие', en: 'Shared' } },
      { selector: '#scopeAll', text: { ru: 'Все', en: 'All' } },

      { selector: '#assigneeFilter option[value="unassigned"]', text: { ru: 'исполнитель: без ответ.', en: 'assignee: unassigned' } },
      { selector: '#tagsFilter', placeholder: { ru: 'теги: учёба, работа', en: 'tags: study, work' } },
      { selector: 'main.center-stage', attr: { 'aria-label': { ru: 'центр планирования', en: 'planning center' } } },
      { selector: '#projectScope', attr: { 'aria-label': { ru: 'Раздел проектов', en: 'Project section' } } },
      { selector: '#projectSelect', attr: { 'aria-label': { ru: 'Проект', en: 'Project' } } },
      { selector: '#searchInput', attr: { 'aria-label': { ru: 'Поиск', en: 'Search' } } },
      { selector: '#tagsFilter', attr: { 'aria-label': { ru: 'Фильтр по тегам', en: 'Filter by tags' } } },
      { selector: '#assigneeFilter', attr: { 'aria-label': { ru: 'Фильтр по исполнителю', en: 'Filter by assignee' } } },
      { selector: '#priorityFilter', attr: { 'aria-label': { ru: 'Фильтр по приоритету', en: 'Filter by priority' } } },
      { selector: '#deadlineFilter', attr: { 'aria-label': { ru: 'Фильтр по сроку', en: 'Filter by deadline' } } },
      { selector: '#sortSelect', attr: { 'aria-label': { ru: 'Сортировка задач', en: 'Sort tasks' } } },
      { selector: '#viewSelect', attr: { 'aria-label': { ru: 'Вид', en: 'View' } } },
      { selector: '#projectBar', attr: { 'aria-label': { ru: 'Проекты', en: 'Projects' } } },
      { selector: '.bottombar .hint:first-child', text: { ru: 'планирование · проекты · задачи', en: 'planning · projects · tasks' } },
      { selector: '.bottombar .hint:last-child', text: { ru: 'пре-альфа', en: 'pre-alpha' } },
      { selector: '.modal__head .icon-btn', attr: { 'aria-label': { ru: 'Закрыть', en: 'Close' } } }
    ]
  };

  const SKIP_SELECTOR = [
    '#ikSiteSettingsPanel',
    '[contenteditable="true"]',
    'script',
    'style',
    'textarea'
  ].join(',');

  function translateDynamic(text, lang) {
    const key = normalize(text);
    const rules = [
      {
        ru: /^проектов:\s*(\d+)$/i,
        en: /^projects:\s*(\d+)$/i,
        toRu: (m) => `проектов: ${m[1]}`,
        toEn: (m) => `projects: ${m[1]}`
      },
      {
        ru: /^задач:\s*(\d+)$/i,
        en: /^tasks:\s*(\d+)$/i,
        toRu: (m) => `задач: ${m[1]}`,
        toEn: (m) => `tasks: ${m[1]}`
      },
      {
        ru: /^дедлайн:\s*(.+)$/i,
        en: /^deadline:\s*(.+)$/i,
        toRu: (m) => `дедлайн: ${translateText(m[1], 'ru')}`,
        toEn: (m) => `deadline: ${translateText(m[1], 'en')}`
      },
      {
        ru: /^приоритет:\s*(.+)$/i,
        en: /^priority:\s*(.+)$/i,
        toRu: (m) => `приоритет: ${translateText(m[1], 'ru')}`,
        toEn: (m) => `priority: ${translateText(m[1], 'en')}`
      },
      {
        ru: /^статус:\s*(.+)$/i,
        en: /^status:\s*(.+)$/i,
        toRu: (m) => `статус: ${translateText(m[1], 'ru')}`,
        toEn: (m) => `status: ${translateText(m[1], 'en')}`
      }
    ];

    for (const rule of rules) {
      if (lang === 'en') {
        const match = key.match(rule.ru);
        if (match) return rule.toEn(match);
      } else {
        const match = key.match(rule.en);
        if (match) return rule.toRu(match);
      }
    }
    return text;
  }

  function translateViaMaps(text, lang, ruToEn, enToRu, aliasRuToEn, aliasEnToRu) {
    const key = normalize(text);
    if (!key) return text;
    if (lang === 'en') return ruToEn[key] || aliasRuToEn[key] || translateDynamic(key, 'en') || text;
    return enToRu[key] || aliasEnToRu[key] || translateDynamic(key, 'ru') || text;
  }

  function translateText(text, lang) {
    return translateViaMaps(text, lang, TEXTS_RU_TO_EN, TEXTS_EN_TO_RU, ALIASES_RU_TO_EN, ALIASES_EN_TO_RU);
  }

  function translatePlaceholder(text, lang) {
    return translateViaMaps(text, lang, PLACEHOLDERS_RU_TO_EN, PLACEHOLDERS_EN_TO_RU, ALIASES_RU_TO_EN, ALIASES_EN_TO_RU);
  }

  function getLang() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved === 'en' ? 'en' : DEFAULT_LANG;
    } catch (e) {
      return DEFAULT_LANG;
    }
  }

  function saveLang(lang) {
    try {
      localStorage.setItem(STORAGE_KEY, lang === 'en' ? 'en' : 'ru');
    } catch (e) {}
  }

  function setPanelState(lang) {
    const ru = document.getElementById('ikLangRu');
    const en = document.getElementById('ikLangEn');
    if (ru) ru.checked = lang === 'ru';
    if (en) en.checked = lang === 'en';
    document.querySelectorAll('.ik-lang-option').forEach((label) => {
      const input = label.querySelector('input');
      label.classList.toggle('is-active', !!input?.checked);
    });
    const gear = document.getElementById('ikGlobalSettingsBtn');
    if (gear) {
      const label = lang === 'en' ? 'Site settings' : 'Настройки сайта';
      gear.setAttribute('aria-label', label);
      gear.setAttribute('title', label);
    }
  }

  function applySelectorRules(lang) {
    const rules = SELECTOR_RULES[PAGE] || [];
    rules.forEach((rule) => {
      document.querySelectorAll(rule.selector).forEach((el) => {
        if (rule.text) el.textContent = rule.text[lang];
        if (rule.placeholder && 'placeholder' in el) el.placeholder = rule.placeholder[lang];
        if (rule.attr) {
          Object.entries(rule.attr).forEach(([attr, values]) => {
            el.setAttribute(attr, values[lang]);
          });
        }
      });
    });
  }

  function shouldSkipElement(el) {
    if (!el || !(el instanceof Element)) return true;
    if (el.closest(SKIP_SELECTOR)) return true;
    return false;
  }

  function applyTextNodeTranslations(lang) {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        if (!parent || shouldSkipElement(parent)) return NodeFilter.FILTER_REJECT;
        if (!normalize(node.nodeValue)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });

    const nodes = [];
    let current;
    while ((current = walker.nextNode())) nodes.push(current);

    nodes.forEach((node) => {
      const match = String(node.nodeValue || '').match(/^(\s*)([\s\S]*?)(\s*)$/);
      if (!match) return;
      const translated = translateText(match[2], lang);
      if (translated !== normalize(match[2])) node.nodeValue = `${match[1]}${translated}${match[3]}`;
    });
  }

  function applyAttributeTranslations(lang) {
    ['placeholder', 'title', 'aria-label'].forEach((attr) => {
      document.querySelectorAll(`[${attr}]`).forEach((el) => {
        const current = el.getAttribute(attr);
        if (!current) return;
        const translated = attr === 'placeholder' ? translatePlaceholder(current, lang) : translateText(current, lang);
        if (translated !== current) el.setAttribute(attr, translated);
      });
    });

    document.querySelectorAll('input[type="button"][value], input[type="submit"][value], input[type="reset"][value]').forEach((el) => {
      const current = el.value;
      const translated = translateText(current, lang);
      if (translated !== current) el.value = translated;
    });
  }

  let isApplying = false;

  function applyLanguage(lang) {
    if (isApplying) return;
    isApplying = true;
    const next = lang === 'en' ? 'en' : 'ru';
    document.documentElement.lang = next;
    if (TITLES[PAGE]) document.title = TITLES[PAGE][next];

    const titleEl = document.getElementById('ikSiteSettingsTitle');
    const closeEl = document.getElementById('ikSiteSettingsClose');
    const labelEl = document.getElementById('ikSiteLangLabel');
    const ruEl = document.getElementById('ikLangRuText');
    const enEl = document.getElementById('ikLangEnText');

    if (titleEl) titleEl.textContent = next === 'en' ? 'Settings' : 'Настройки';
    if (closeEl) closeEl.textContent = next === 'en' ? 'Close' : 'Закрыть';
    if (labelEl) labelEl.textContent = next === 'en' ? 'Site language' : 'Язык сайта';
    if (ruEl) ruEl.textContent = next === 'en' ? 'Russian' : 'Русский';
    if (enEl) enEl.textContent = next === 'en' ? 'English' : 'Английский';

    applySelectorRules(next);
    applyTextNodeTranslations(next);
    applyAttributeTranslations(next);
    setPanelState(next);
    isApplying = false;
  }

  function setLang(lang) {
    const next = lang === 'en' ? 'en' : 'ru';
    saveLang(next);
    applyLanguage(next);
    document.dispatchEvent(new CustomEvent('ik:languagechange', { detail: { lang: next } }));
  }

  function buildGearButton() {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'ikGlobalSettingsBtn';
    btn.className = 'ik-gear-btn';
    btn.setAttribute('aria-label', 'Настройки сайта');
    btn.setAttribute('title', 'Настройки сайта');
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M12 8.4A3.6 3.6 0 1 0 12 15.6A3.6 3.6 0 1 0 12 8.4Z"/>
        <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1.2 1.2 0 0 1 0 1.7l-1.6 1.6a1.2 1.2 0 0 1-1.7 0l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a1.2 1.2 0 0 1-1.2 1.2h-2.3A1.2 1.2 0 0 1 9.9 20v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a1.2 1.2 0 0 1-1.7 0l-1.6-1.6a1.2 1.2 0 0 1 0-1.7l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4A1.2 1.2 0 0 1 2.8 13v-2.3A1.2 1.2 0 0 1 4 9.5h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a1.2 1.2 0 0 1 0-1.7l1.6-1.6a1.2 1.2 0 0 1 1.7 0l.1.1a1 1 0 0 0 1.1.2 1 1 0 0 0 .6-.9V4A1.2 1.2 0 0 1 11.1 2.8h2.3A1.2 1.2 0 0 1 14.6 4v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a1.2 1.2 0 0 1 1.7 0l1.6 1.6a1.2 1.2 0 0 1 0 1.7l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6h.2A1.2 1.2 0 0 1 21.2 10.7V13A1.2 1.2 0 0 1 20 14.2h-.2a1 1 0 0 0-.4.8Z"/>
      </svg>
    `;
    return btn;
  }

  function buildPanel() {
    const panel = document.createElement('div');
    panel.id = 'ikSiteSettingsPanel';
    panel.className = 'ik-settings-panel';
    panel.hidden = true;
    panel.innerHTML = `
      <div class="ik-settings-panel__head">
        <p class="ik-settings-panel__title" id="ikSiteSettingsTitle">Настройки</p>
        <button type="button" class="ik-settings-panel__close" id="ikSiteSettingsClose">Закрыть</button>
      </div>
      <div class="ik-settings-group">
        <div class="ik-settings-label" id="ikSiteLangLabel">Язык сайта</div>
        <div class="ik-lang-switch">
          <label class="ik-lang-option" for="ikLangRu">
            <input type="radio" name="ikSiteLang" id="ikLangRu" value="ru" />
            <span id="ikLangRuText">Русский</span>
          </label>
          <label class="ik-lang-option" for="ikLangEn">
            <input type="radio" name="ikSiteLang" id="ikLangEn" value="en" />
            <span id="ikLangEnText">Английский</span>
          </label>
        </div>
      </div>
    `;
    document.body.appendChild(panel);
    return panel;
  }

  function initSettingsUI() {
    if (document.getElementById('ikGlobalSettingsBtn')) return;

    const gearBtn = buildGearButton();
    const panel = buildPanel();
    const closeBtn = panel.querySelector('#ikSiteSettingsClose');
    const header = document.querySelector('.ik-site-nav');

    if (header) {
      let actions = header.querySelector('.ik-site-nav__actions');
      if (!actions) {
        actions = document.createElement('div');
        actions.className = 'ik-site-nav__actions';
        header.appendChild(actions);
      }
      actions.appendChild(gearBtn);
    } else {
      const floating = document.createElement('div');
      floating.className = 'ik-floating-settings';
      floating.appendChild(gearBtn);
      document.body.appendChild(floating);
    }

    const openPanel = () => { panel.hidden = false; };
    const closePanel = () => { panel.hidden = true; };

    gearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.hidden ? openPanel() : closePanel();
    });
    closeBtn.addEventListener('click', closePanel);
    panel.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => { if (!panel.hidden) closePanel(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) closePanel(); });
    panel.querySelectorAll('input[name="ikSiteLang"]').forEach((input) => {
      input.addEventListener('change', () => setLang(input.value));
    });
  }

  function initObserver() {
    let queued = false;
    const observer = new MutationObserver(() => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        applyLanguage(getLang());
      });
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['placeholder', 'title', 'aria-label', 'value'] });
  }

  window.IKSiteLang = {
    get: getLang,
    set: setLang,
    apply: () => applyLanguage(getLang())
  };

  document.addEventListener('DOMContentLoaded', () => {
    initSettingsUI();
    applyLanguage(getLang());
    initObserver();
  });
})();
