<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Item Key - Расписание</title>

  <script>
    (function () {
      var key = "ik_site_theme_v1";
      var stored = null;
      try { stored = localStorage.getItem(key); } catch (e) {}
      var theme = (stored === "dark" || stored === "light")
        ? stored
        : ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>

  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="./schedule.css" />
  <link rel="stylesheet" href="../../assets/css/theme.css" />
</head>

<body class="page page-schedule ik-booting" data-ik-loading>
  <header class="ik-site-nav" id="ikSiteNav">
    <button type="button" class="ik-site-nav__link" id="ikBackBtn" title="Вернуться назад">← Назад</button>
    <a class="ik-site-nav__link" href="/item_key/">Главное меню</a>
  </header>

  <main class="center-stage" aria-label="центр расписания">
    <section class="schedule-shell">
      <header class="schedule-head" data-ik-stage="hero">
        <div class="schedule-title">
          <div class="kicker">module</div>
          <h1>расписание</h1>
        </div>

        <div class="schedule-head__actions">
          <button class="btn" type="button" id="btnNewItem">+ план</button>
          <button class="btn" type="button" id="btnNewBlock">+ слот</button>
        </div>
      </header>

      <nav class="schedule-tabs" aria-label="Разделы расписания" data-ik-stage="top">
        <button class="schedule-tab is-active" type="button" data-tab="today">Сегодня</button>
        <button class="schedule-tab" type="button" data-tab="calendar">Общее расписание</button>
        <button class="schedule-tab" type="button" data-tab="assistant">Помощник</button>
        <button class="schedule-tab" type="button" data-tab="settings">Настройки</button>
      </nav>

      <section id="scheduleContent" class="schedule-content" data-ik-stage="content"></section>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true">
      <div class="modal__head">
        <div class="modal__title" id="modalTitle"></div>
        <button class="icon-btn" type="button" data-close aria-label="Закрыть">×</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast-stack" id="toasts" aria-live="polite"></div>

  <script src="../../assets/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script type="module" src="./schedule.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var backBtn = document.getElementById('ikBackBtn');

      function safeBrowserBack(fallbackHref) {
        if (window.history.length <= 1) {
          window.location.href = fallbackHref;
          return;
        }

        var currentHref = window.location.href;
        var navigated = false;
        var markNavigated = function () { navigated = true; };

        window.addEventListener('pagehide', markNavigated, { once: true });
        window.addEventListener('popstate', markNavigated, { once: true });

        window.history.back();

        window.setTimeout(function () {
          if (navigated) return;
          if (window.location.href === currentHref) {
            window.location.href = fallbackHref;
          }
        }, 450);
      }

      if (backBtn) {
        backBtn.addEventListener('click', function (event) {
          event.preventDefault();
          if (window.IKLoading && typeof window.IKLoading.leave === 'function') {
            window.IKLoading.leave(function () { safeBrowserBack('/item_key/item-crate/'); });
          } else {
            safeBrowserBack('/item_key/item-crate/');
          }
        });
      }

      if (window.IKLoading) window.IKLoading.done();
    });
  </script>
</body>
</html>
