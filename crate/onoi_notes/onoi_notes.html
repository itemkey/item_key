<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Item Key - onoi_notes</title>

  <!-- глобальный стиль сайта -->
  <link rel="stylesheet" href="../../assets/css/styles.css" />

  <style>
    /* =========================================================
       onoi_notes - single-file notes manager (IndexedDB + optional GitHub Sync)
       ========================================================= */
    .notes-wrap, .notes-wrap *{ box-sizing: border-box; }
    :root{
      --footerH: 56px;
      --topbarOffset: 0px;

      --bgCard: rgba(255,255,255,.86);
      --bd: rgba(0,0,0,.14);
      --bd2: rgba(0,0,0,.26);
      --muted: rgba(0,0,0,.62);

      --fs-ui: 12px;
      --fs-note: 16px;
      --lh-note: 1.7;
      --font-ui: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      --font-note: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      --accent: rgba(0,0,0,.86);
      --accentSoft: rgba(0,0,0,.06);
      --accentSoft2: rgba(0,0,0,.10);


      --radius: 0px;
    }

    .center-stage{
      padding-top: var(--topbarOffset);
      padding-bottom: calc(var(--footerH) + 20px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .notes-wrap{
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
      padding: 12px 18px 22px;
      min-width: 0;
      font-family: var(--font-ui);
    }

    .n-title{
      padding: 6px 0 0;
      text-align: center;
      display: grid;
      gap: 8px;
    }
    .n-title h1{
      margin: 0;
      font-size: 14px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .n-title .sub{
      font-size: 11px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: rgba(0,0,0,.55);
    }

    .n-shell{
      display: grid;
      grid-template-columns: minmax(240px, var(--sidebarW, 320px)) 10px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      min-width: 0;
    }


    .n-col-left{
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .n-col-right{ min-width: 0; }

    .v-splitter{
      width: 10px;
      align-self: stretch;
      border-radius: 999px;
      cursor: col-resize;
      background: linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,.04));
      border: 1px solid rgba(0,0,0,.10);
      opacity: .55;
      user-select: none;
      touch-action: none;
    }
    .v-splitter:hover{ opacity: .85; }
    .v-splitter:active{ opacity: 1; }

    body.is-sidebar-collapsed .n-col-left{ display:none; }
    body.is-sidebar-collapsed .v-splitter{ display:none; }
    body.is-sidebar-collapsed .n-shell{ grid-template-columns: 1fr; }
    .n-card{
      border: 1px solid var(--bd);
      background: var(--bgCard);
      padding: 12px;
      border-radius: var(--radius);
      min-width: 0;
    }
    .n-label{
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(0,0,0,.58);
      margin-bottom: 8px;
    }

    /* Top utility bar */
    .n-topbar{
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 10px;
      align-items: center;
    }
    .n-search{
      width: 100%;
      border: 1px solid var(--bd);
      background: rgba(255,255,255,.92);
      padding: 10px 12px;
      font-size: 12px;
      outline: none;
      border-radius: 0;
      height: 40px;
      min-width: 0;
    }
    .n-btn{
      border: 1px solid var(--bd);
      background: rgba(255,255,255,.90);
      padding: 11px 10px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, opacity .18s ease;
      border-radius: 0;
      min-height: 40px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .n-btn:hover{ transform: translateY(-1px); border-color: rgba(0,0,0,.30); opacity: .98; }
    .n-btn:disabled{ opacity: .5; cursor: not-allowed; transform: none; }
    .n-btn:focus-visible{ outline: 2px solid rgba(0,0,0,.55); outline-offset: 2px; }

    .n-pill{
      border: 1px solid var(--bd);
      background: rgba(255,255,255,.82);
      padding: 5px 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 10px;
      color: rgba(0,0,0,.62);
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      min-height: 30px;
    }
    .dot{
      width: 8px; height: 8px;
      border: 1px solid rgba(0,0,0,.18);
      background: rgba(0,0,0,.10);
      border-radius: 0;
      display: inline-block;
    }
    .dot.ok{ background: rgba(0,0,0,.18); }
    .dot.warn{ background: rgba(255,170,0,.35); border-color: rgba(255,170,0,.6); }
    .dot.bad{ background: rgba(255,0,0,.25); border-color: rgba(255,0,0,.45); }

    /* Category tree */
    .tree{
      display: grid;
      gap: 6px;
      user-select: none;
    }
    .tree-actions{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    
.tree-breadcrumb{
  margin: 6px 0 10px;
  padding: 6px 8px;
  font-size: 12px;
  color: rgba(0,0,0,.70);
  border: 1px dashed rgba(0,0,0,.16);
  background: rgba(255,255,255,.55);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tree ul{
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 4px;
    }
    .tree-item{
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 6px;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid rgba(0,0,0,.10);
  background: rgba(255,255,255,.70);
  cursor: pointer;
  min-width: 0;
  position: relative;
  transition: background .12s ease, border-color .12s ease, transform .06s ease;
  outline: none;
}
.tree-item:hover{
  border-color: rgba(0,0,0,.28);
  background: rgba(255,255,255,.86);
}
.tree-item:active{ transform: translateY(1px); }

/* Visually clear selection + navigation context */
.tree-item.is-active{
  border-color: rgba(0,0,0,.38);
  background: var(--accentSoft);
  box-shadow: inset 4px 0 0 0 var(--accent);
}
.tree-item.is-path:not(.is-active){
  border-color: rgba(0,0,0,.18);
  background: rgba(0,0,0,.03);
  box-shadow: inset 2px 0 0 0 rgba(0,0,0,.30);
}
.tree-item:focus-visible{
  box-shadow: 0 0 0 2px rgba(0,0,0,.30), inset 4px 0 0 0 var(--accent);
  border-color: rgba(0,0,0,.50);
  background: var(--accentSoft2);
}
.tree-tgl{
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.9);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      border-radius: 0;
      appearance: none;
      -webkit-appearance: none;
      font-family: inherit;
      color: inherit;
    }
    .tree-tgl:focus-visible{ outline: 2px solid rgba(0,0,0,.55); outline-offset: 2px; }

    .tree-name{
      font-size: 12px;
      letter-spacing: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-count{
      font-size: 10px;
      color: rgba(0,0,0,.55);
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 6px;
    }

    /* Make category vs subcategory visually distinct */
    .tree-item[data-depth="0"]{
      background: rgba(255,255,255,.86);
      border-color: rgba(0,0,0,.18);
      border-left: 4px solid rgba(0,0,0,.35);
      padding-left: 10px;
    }
    .tree-item[data-depth="0"] .tree-name{
      font-weight: 750;
      font-size: 13px;
      letter-spacing: 1.2px;
    }
    .tree-item[data-depth="0"] .tree-name::after{
      content: "категория";
      margin-left: 8px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: .38;
    }
.tree-item[data-depth="0"] .tree-name{
  font-weight: 750;
}
.tree-item[data-depth="0"] .tree-name::after{
  padding: 2px 6px;
  border: 1px solid rgba(0,0,0,.18);
  background: rgba(0,0,0,.04);
  border-radius: 999px;
}
.tree-item[data-depth]:not([data-depth="0"]) .tree-name{
  font-weight: 650;
}


    .tree-item[data-depth]:not([data-depth="0"]){
      background: rgba(255,255,255,.62);
      border-style: dashed;
      border-color: rgba(0,0,0,.14);
    }
    .tree-item[data-depth]:not([data-depth="0"]) .tree-name{
      font-weight: 560;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: .92;
    }
    .tree-item[data-depth]:not([data-depth="0"]) .tree-name::before{
      content: "↳ ";
      opacity: .65;
    }


    .indent{ margin-left: 34px; padding-left: 18px; border-left: 2px dashed rgba(0,0,0,.18); }
    .indent > li{ position: relative; }
    .indent > li > .tree-item{ position: relative; }
    .indent > li > .tree-item::before{ content:''; position:absolute; left:-13px; top:50%; width:10px; border-top:1px dashed rgba(0,0,0,.18); }
    .indent .tree-item{ background: rgba(255,255,255,.62); } /* (kept for legacy) */

    /* Notes list */
    .list{
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .list-head{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 4px;
    }
    
    
    .list-actions{
      display: inline-flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: nowrap;
    }
    /* В остальном проекте .n-btn.is-primary растягивается на всю ширину.
       В шапке списка заметок нам нужен нормальный "inline" размер. */
    .list-actions .n-btn.is-primary{ width: auto; }
    @media (max-width: 520px){
      .list-head{ grid-template-columns: 1fr; gap: 8px; }
      .list-actions{ justify-content: flex-start; }
    }
.list-meta{
      font-size: 11px;
      color: rgba(0,0,0,.68);
      line-height: 1.45;
      margin: 0;
    }
    .note-row{
      display: grid;
      gap: 6px;
      padding: 10px 10px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.70);
      cursor: pointer;
      min-width: 0;
    }
    .note-row:hover{ border-color: rgba(0,0,0,.22); }
    .note-row.is-active{
      border-color: rgba(0,0,0,.34);
      background: rgba(255,255,255,.90);
    }
    .note-title{
      margin: 0;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .note-snippet{
      margin: 0;
      font-size: 11px;
      line-height: 1.4;
      color: rgba(0,0,0,.72);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }

    /* Editor */
    .editor-head{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
.editor-head-right{
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      min-width: 0;
    }
    .editor-head-right .crumbs{
      flex: 1 1 auto;
      min-width: 0;
    }
    .crumbs{
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(0,0,0,.58);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar{
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .toolbar-row{
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      padding-bottom: 4px;
      align-items: center;
    }
    .toolbar-row::-webkit-scrollbar{ height: 8px; }
    .toolsep{
      width: 1px;
      height: 24px;
      background: rgba(0,0,0,.18);
      margin: 0 2px;
      flex: 0 0 auto;
      align-self: center;
    }
    .tool, .toolsel{
      border: 1px solid var(--bd);
      background: rgba(255,255,255,.92);
      height: 38px;
      padding: 0 10px;
      font-size: 12px;
      outline: none;
      border-radius: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
    }
    .tool:hover, .toolsel:hover{ border-color: rgba(0,0,0,.30); }
    .tool:focus-visible, .toolsel:focus-visible{ outline: 2px solid rgba(0,0,0,.55); outline-offset: 2px; }
    .toolsel{ cursor: default; }
    .tool.is-primary{ font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    .swatch{
      width: 16px; height: 16px; border: 1px solid rgba(0,0,0,.22);
      background: #000;
      display: inline-block;
    }

    .editor-title{
      width: 100%;
      border: 1px solid var(--bd);
      background: rgba(255,255,255,.92);
      padding: 10px 12px;
      font-size: 12px;
      outline: none;
      border-radius: 0;
      height: 40px;
      min-width: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .editor{
      border: 1px solid var(--bd);
      background: rgba(255,255,255,.92);
      padding: 14px 14px;
      min-height: 420px;
      outline: none;
      border-radius: 0;
      font-size: var(--fs-note);
      line-height: var(--lh-note);
      font-family: var(--font-note);
      word-break: break-word;
      display: flow-root;
      overflow-x: hidden;
    }
    .editor:focus{ border-color: rgba(0,0,0,.34); }

    .editor img{
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px 0;
      border: 1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.70);
    }
    .editor blockquote{
      margin: 10px 0;
      padding: 10px 12px;
      border-left: 3px solid rgba(0,0,0,.25);
      background: rgba(255,255,255,.70);
    }
    .editor pre{
      background: rgba(0,0,0,.04);
      border: 1px solid rgba(0,0,0,.10);
      padding: 10px 12px;
      overflow: auto;
    }

    .hint{
      margin: 0;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(0,0,0,.72);
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.25);
      display: none;
      z-index: 99999;
      padding: 16px;
    }
    .modal.is-open{ display: grid; place-items: center; }
    .modal-card{
      width: min(860px, calc(100% - 8px));
      max-height: calc(100vh - 40px);
      overflow: auto;
      border: 1px solid rgba(0,0,0,.18);
      background: rgba(255,255,255,.96);
      padding: 14px 14px 12px;
      border-radius: 0;
    }
    .modal-head{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .modal-title{
      margin: 0;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .modal-grid{
      display: grid;
      gap: 12px;
    }
    .grid2{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field{
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .field label{
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(0,0,0,.62);
    }
    .field input, .field select{
      width: 100%;
      border: 1px solid var(--bd);
      background: rgba(255,255,255,.92);
      padding: 10px 12px;
      font-size: 12px;
      outline: none;
      border-radius: 0;
      height: 40px;
      min-width: 0;
    }
    .field input[type="color"]{ padding: 0; height: 40px; }
    .modal-actions{
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .warnbox{
      border: 1px dashed rgba(0,0,0,.22);
      background: rgba(255,255,255,.78);
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(0,0,0,.72);
    }
    code.k{ background: rgba(0,0,0,.06); padding: 1px 4px; }

    /* Responsive */
    @media (max-width: 1060px){
      :root{ --topbarOffset: 66px; }
      .notes-wrap{ padding: 10px 14px 18px; }
      .n-shell{ grid-template-columns: 1fr; }
      .editor{ min-height: 360px; }
      .grid2{ grid-template-columns: 1fr; }
      .modal-actions{ grid-template-columns: 1fr; }
      .tree-actions{ grid-template-columns: 1fr; }
      .n-topbar{ grid-template-columns: 1fr; }
    }
  
    /* =========================================================
       Mobile-first improvements (phone UX)
       - Sidebar becomes off-canvas drawer
       - Larger touch targets + horizontal scrolling toolbar
       - Hide rails on small screens to maximize editor space
       ========================================================= */

    .drawer-overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      display: none;
      z-index: 9997;
      touch-action: none;
    }
    body.drawer-open .drawer-overlay{ display: block; }

    .drawer-head{
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px 10px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.92);
    }
    .drawer-title{
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(0,0,0,.70);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 900px){
      /* maximize content area */
      :root{
        --topbarOffset: 60px;
        --footerH: 58px;
        --fs-ui: 13px;
      }

      /* hide global rails on phones */
      .rail{ display: none !important; }

      .notes-wrap{ padding: 10px 10px 18px; }
      .n-title h1{ letter-spacing: 5px; }
      .n-title .sub{ letter-spacing: 2.5px; }

      /* Keep editor as primary: sidebar becomes a drawer */
      .n-shell{ grid-template-columns: 1fr; }
      .v-splitter{ display: none !important; }

      .n-col-left{
        position: fixed;
        left: 0;
        top: var(--topbarOffset);
        bottom: calc(var(--footerH) + env(safe-area-inset-bottom));
        width: min(420px, 92vw);
        max-width: 92vw;
        overflow: auto;
        z-index: 9998;
        transform: translateX(-110%);
        transition: transform .18s ease;
        box-shadow: 10px 0 40px rgba(0,0,0,.18);
        background: transparent; /* cards inside have their own bg */
        padding: 10px;
      }
      body.drawer-open .n-col-left{ transform: translateX(0); }

      .drawer-head{ display: flex; position: sticky; top: 0; z-index: 1; }

      /* Make the topbar wrap nicely on small screens */
      .n-topbar{
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
.n-pill{ grid-column: 1 / -1; justify-content: flex-start; }

      /* Buttons and fields: better touch targets */
      .n-btn{ min-height: 44px; padding: 12px 12px; letter-spacing: 2px; }
      .n-search{ height: 44px; font-size: 13px; }
      .editor-title{ height: 44px; font-size: 12px; }

      /* Toolbar: single-row horizontal scrolling */
      .toolbar-row{
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        padding-bottom: 4px;
      }
      .toolbar-row::-webkit-scrollbar{ height: 8px; }
      .tool, .toolsel{
        flex: 0 0 auto;
        height: 42px;
        font-size: 13px;
      }
      .tool.is-primary{ letter-spacing: 3px; }

      /* Editor: comfortable height on phones */
      .editor{
        min-height: 55vh;
        padding: 14px 12px;
      }

      /* Modal: full height comfort */
      .modal{ padding: 10px; }
      .modal-card{ width: 100%; max-height: calc(100vh - 20px); }
    }

    @media (max-width: 520px){
      .n-title h1{ letter-spacing: 4px; }
      .n-title .sub{ font-size: 10px; }
      .editor-head{
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .editor-head-right{
        justify-content: space-between;
      }
      .crumbs{ max-width: 62vw; }
      .n-btn.is-primary{ width: 100%; }
    }

    @media (prefers-reduced-motion: reduce){
      .n-btn, .n-col-left{ transition: none !important; }
    }


    /* =========================================================
       UX polish (no-tooltips, clearer structure) - 2026-01
       - No rounded corners preserved
       - Stronger contrast + clearer selected states
       ========================================================= */

    :root{
      --bgCard: rgba(255,255,255,.90);
      --bd: rgba(0,0,0,.18);
      --bd2: rgba(0,0,0,.34);
      --muted: rgba(0,0,0,.66);

/* =========================================================
   Image objects (Word/Notion-like) - 2026-02
   - Figure is the object (contenteditable=false)
   - Modes: left/right (wrap), center (block), inline
   ========================================================= */
.editor figure.onoi-img{
  position: relative;
  display: block;
  max-width: 100%;
  margin: 10px 0;
  border: 1px solid rgba(0,0,0,.12);
  background: rgba(255,255,255,.70);
  padding: 0;
  box-sizing: border-box;
}
.editor figure.onoi-img[contenteditable="false"]{ user-select: none; }
.editor figure.onoi-img img{
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  margin: 0 !important;
  border: 0 !important;
  background: transparent;
  pointer-events: none;
  -webkit-user-drag: none;
  user-drag: none;
}
.editor figure.onoi-img.is-selected{
  outline: 2px solid rgba(0,0,0,.55);
  outline-offset: 2px;
}

/* Wrap modes */
.editor figure.onoi-img[data-mode="left"]{ float: left; margin: 10px 14px 10px 0; max-width: calc(100% - 14px); }
.editor figure.onoi-img[data-mode="right"]{ float: right; margin: 10px 0 10px 14px; max-width: calc(100% - 14px); }
.editor figure.onoi-img[data-mode="center"]{ float: none; clear: both; margin: 10px auto; }
.editor figure.onoi-img[data-mode="inline"]{ float: none; clear: none; display: inline-block; margin: 0 6px; vertical-align: baseline; max-width: calc(100% - 12px); }

.editor figure.onoi-img.is-dragging{
  float: none !important;
  clear: both !important;
  margin: 10px auto !important;
  opacity: .65;
}

/* Drop marker for drag-and-drop */
.editor .onoi-img-drop-marker{
  clear: both;
  height: 2px;
  background: rgba(0,0,0,.70);
  margin: 6px 0;
}

/* Overlay (resize handles + mini toolbar) */
.onoi-img-overlay{
  position: fixed;
  z-index: 100001;
  pointer-events: none;
}
.onoi-img-overlay .box{
  position: absolute;
  inset: 0;
  border: 2px solid rgba(0,0,0,.55);
  box-sizing: border-box;
}
.onoi-img-overlay .h{
  position: absolute;
  width: 10px;
  height: 10px;
  background: rgba(255,255,255,.98);
  border: 1px solid rgba(0,0,0,.70);
  box-sizing: border-box;
  pointer-events: auto;
}
.onoi-img-overlay .h[data-pos="nw"]{ left: -6px; top: -6px; cursor: nwse-resize; }
.onoi-img-overlay .h[data-pos="ne"]{ right: -6px; top: -6px; cursor: nesw-resize; }
.onoi-img-overlay .h[data-pos="sw"]{ left: -6px; bottom: -6px; cursor: nesw-resize; }
.onoi-img-overlay .h[data-pos="se"]{ right: -6px; bottom: -6px; cursor: nwse-resize; }
.onoi-img-overlay .h[data-pos="n"]{ left: 50%; top: -6px; transform: translateX(-50%); cursor: ns-resize; }
.onoi-img-overlay .h[data-pos="s"]{ left: 50%; bottom: -6px; transform: translateX(-50%); cursor: ns-resize; }
.onoi-img-overlay .h[data-pos="w"]{ left: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
.onoi-img-overlay .h[data-pos="e"]{ right: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }

.onoi-img-bubble{
  position: fixed;
  z-index: 100002;
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 6px 8px;
  background: rgba(255,255,255,.94);

}
.onoi-img-bubble button:hover{ border-color: rgba(0,0,0,.40); }
.onoi-img-bubble button.is-on{
  border-color: rgba(0,0,0,.55);
  background: rgba(0,0,0,.03);
}

</style>

      t = t.replace(/[\t\f\v ]+/g, ' ');

    function idbOpen(){
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(STORE.meta)) db.createObjectStore(STORE.meta, { keyPath: 'key' });
          if(!db.objectStoreNames.contains(STORE.cats)) db.createObjectStore(STORE.cats, { keyPath: 'id' });
          if(!db.objectStoreNames.contains(STORE.notes)) db.createObjectStore(STORE.notes, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbTx(mode, stores, fn){
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(stores, mode);
        const st = {};
        stores.forEach(s => st[s] = tx.objectStore(s));
        const res = fn(st);
        tx.oncomplete = () => { db.close(); resolve(res); };
        tx.onerror = () => { db.close(); reject(tx.error); };
        tx.onabort = () => { db.close(); reject(tx.error); };
      });
    }

      put: (store, val) => idbTx('readwrite',[store], st => new Promise((res, rej)=>{ const r=st[store].put(val); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); })),

      all: (store) => idbTx('readonly',[store], st => new Promise((res, rej)=>{ const r=st[store].getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); })),
      clear: (store) => idbTx('readwrite',[store], st => new Promise((res, rej)=>{ const r=st[store].clear(); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); })),

function toast(title, body, opts={}){
  try{
    const t = document.createElement('div');
    t.className = 'toast';
    const h = document.createElement('p');
    h.className = 'toast-title';
    h.textContent = String(title || 'info');
    const b = document.createElement('p');
    b.className = 'toast-body';
    b.textContent = String(body || '');
    t.appendChild(h);
    t.appendChild(b);

    if(opts.actionText && typeof opts.onAction === 'function'){
      const a = document.createElement('div');
      a.className = 'toast-actions';
      const btn = document.createElement('button');
      btn.className = 'n-btn';
      btn.type = 'button';
      btn.textContent = String(opts.actionText);
      btn.addEventListener('click', () => { try{ opts.onAction(); }catch(e){}; t.remove(); });
      a.appendChild(btn);
      t.appendChild(a);
    }

    toastWrap.appendChild(t);
    const ttl = Number(opts.ttl || 3200);
    window.setTimeout(() => { try{ t.remove(); }catch(e){} }, ttl);
  }catch(e){}
}

let uiModalResolve = null;
let uiModalMode = 'alert'; // alert|confirm|prompt
let uiModalLastFocus = null;

function openUIModal({title='dialog', message='', mode='alert', label='value', value='', placeholder=''} = {}){
  return new Promise((resolve) => {
    uiModalResolve = resolve;
    uiModalMode = mode;
    uiModalLastFocus = document.activeElement;

    uiModalTitle.textContent = String(title);
    uiModalMsg.textContent = String(message || '');

    const isPrompt = mode === 'prompt';
    uiModalField.style.display = isPrompt ? 'grid' : 'none';
    uiModalLabel.textContent = String(label || 'value');
    uiModalInput.value = String(value || '');
    uiModalInput.placeholder = String(placeholder || '');

    uiModalCancel.style.display = (mode === 'alert') ? 'none' : 'inline-flex';
    uiModalOk.textContent = (mode === 'prompt') ? 'Сохранить' : 'Ок';

    uiModal.classList.add('is-open');
    document.body.classList.add('modal-open');
    window.setTimeout(() => {
      if(isPrompt) uiModalInput.focus();
      else uiModalOk.focus();
    }, 0);
  });
}

function closeUIModal(result){
  if(!uiModal.classList.contains('is-open')) return;
  uiModal.classList.remove('is-open');
  document.body.classList.remove('modal-open');
  const r = uiModalResolve;
  uiModalResolve = null;
  try{
    if(uiModalLastFocus && uiModalLastFocus.focus) uiModalLastFocus.focus();
  }catch(e){}
  if(r) r(result);
}

uiModalClose.addEventListener('click', () => closeUIModal(uiModalMode === 'alert' ? true : null));
uiModalCancel.addEventListener('click', () => closeUIModal(null));
uiModalOk.addEventListener('click', () => {
  if(uiModalMode === 'prompt') closeUIModal(String(uiModalInput.value || '').trim());
  else closeUIModal(true);
});
uiModal.addEventListener('click', (e) => {
  if(e.target === uiModal) closeUIModal(uiModalMode === 'alert' ? true : null);
});
window.addEventListener('keydown', (e) => {
  if(!uiModal.classList.contains('is-open')) return;
  if(e.key === 'Escape'){
    e.preventDefault();
    closeUIModal(uiModalMode === 'alert' ? true : null);
  }
  if(uiModalMode === 'prompt' && e.key === 'Enter' && (document.activeElement === uiModalInput)){
    e.preventDefault();
    closeUIModal(String(uiModalInput.value || '').trim());
  }
});

async function uiAlert(msg, title='info'){
  await openUIModal({title, message: msg, mode:'alert'});
  return true;
}
async function uiConfirm(msg, title='confirm'){
  const r = await openUIModal({title, message: msg, mode:'confirm'});
  return !!r;
}
async function uiPrompt(msg, opts={}){
  const r = await openUIModal({
    title: opts.title || 'input',
    message: msg,
    mode:'prompt',
    label: opts.label || 'value',
    value: opts.value || '',
    placeholder: opts.placeholder || ''
  });
  if(r === null) return null;
  const v = String(r || '').trim();
  return v ? v : null;
}

        mk('en-01', 'Population', `<p>If I pull the card “Population”, I speak about the people who live in Belarus. Belarus is not a huge country, so the population is not very big. It is about nine million people (approximately). Many people live in towns and cities, because cities give more jobs, universities, and services. The biggest city is Minsk. It is the capital, and it has the largest number of residents. Other large cities are Gomel, Mogilev, Vitebsk, Grodno, and Brest.</p>
<p>People in Belarus mostly speak two languages in daily life - Belarusian and Russian. In many families both languages are used. At school you can study Belarusian, Russian, and also foreign languages like English. The main ethnic group is Belarusians, but there are also Russians, Ukrainians, Poles, and people from other groups.</p>

<p>When we talk about population, we can also mention living standards. People need decent wages, good schools, medical care, and social protection. So, population is not only a number - it is real lives, families, work, and the future of the country.</p>`, 0),
        mk('en-02', 'Map of Belarus (regions and neighbours)', `<p>If I pull the map card, I explain where Belarus is and what it looks like on the map. Belarus is in Eastern Europe. It has no sea, so it is a landlocked country. Belarus is located between several neighbours: Poland is to the west, Lithuania and Latvia are to the north-west and north, Russia is to the east, and Ukraine is to the south. Because of this position, Belarus is often a crossroads for roads and railways. People and goods can travel through Belarus from one part of Europe to another part.</p>
<p>The map also shows the main regions. Belarus has regions like Brest, Grodno, Minsk, Vitebsk, Mogilev, and Gomel. Each region has its own big city. Minsk is special, because it is the capital and it is also a separate city with its own status. Minsk is near the centre of the country, and many roads go to Minsk.</p>
<p>When you look at Belarus on the map, you can also speak about nature. Belarus is known for forests, fields, rivers, and lakes. The land is mostly flat, so it is comfortable for farming and for building roads. The climate has cold winters and warm summers, so the seasons are clear. This influences agriculture, transport, and everyday life.</p>

        mk('en-03', 'Legislative power - Executive power - Judicial power', `<p>If I pull this card, I talk about how power is organised in Belarus. The key idea is that state power is divided into three main parts: legislative, executive, and judicial power. Each part has its own job, so the system can work in an organised way.</p>
<p>Legislative power means making laws. In Belarus, the Parliament is called the National Assembly. It has two chambers. One chamber is the House of Representatives, and its deputies are elected by the people. The other chamber is the Council of the Republic, which is a regional representative body with members from the regions and Minsk. Legislative power discusses new laws, approves laws, and changes laws when it is necessary.</p>
<p>Executive power means running the country day by day. It includes the President and the Government. The Government is called the Council of Ministers. It includes the Prime Minister, deputy prime ministers, and ministers. The Prime Minister is appointed by the President and approved by Parliament. The Government works with the economy, education, healthcare, security, transport, and many other areas. It makes sure the country works every day, not only on paper.</p>
<p>Judicial power means courts. Courts decide different cases - civil cases, criminal cases, administrative cases, and economic cases. There is also the Constitutional Court. It checks if laws follow the Constitution. Judges have an important role because they must follow the law and protect legal rules.</p>
<p>So, this card is like a simple explanation: Parliament makes laws, the Government carries out these laws, and courts check and protect the law in real situations.</p>`, 2),

<p>When a country has a big meeting like this, it usually wants to hear many voices. Representatives can come from different regions and different сферы жизни - for example, education, industry, culture, youth organisations, and public institutions. The Congress can be a place where people speak about what has been done well and what needs improvement. It can also be a place where long-term goals are explained in simple words, so people understand what direction the country wants to follow.</p>
<p>In such discussions, you often hear about well-being of people. That includes decent wages, stable jobs, medical care, education, and social protection. Another common topic is development - how to modernise enterprises, how to support new technologies, and how to improve infrastructure like roads and public buildings.</p>
<p>This card can also connect to the idea of unity. A national congress often shows that the country wants to work together, not separately. Even if people have different opinions, the goal is to speak, listen, and choose priorities.</p>
<p>So, in easy English, I would say: the All-Belarus National Congress is a big meeting for big questions. It is about plans, priorities, and the future of the country.</p>`, 3),
        mk('en-05', 'Local power', `<p>If I pull the card “Local power”, I talk about power close to people’s everyday life. Local power is very important because it solves local problems - the problems you see in your street, school, hospital, or transport system. In Belarus, local power is represented by locally elected Councils of Deputies and by executive committees of different levels.</p>
<p>Deputies are elected for a term (in the text you gave, it says a 4-year term). Their job is to deal with local issues and to represent local people. That means they should know what citizens need in their town, district, or village. For example, local authorities can work with issues in health, education, and social welfare. They can support schools and kindergartens, help organise medical services, and take care of social protection for people who need help.</p>
<p>Local power also deals with trade and transport inside the area. For example, local decisions can influence bus routes, road repairs, street lighting, public parks, and local markets. Of course, local power must work within the framework of existing laws. That means local leaders cannot just do anything they want - they must follow national rules.</p>
<p>Executive committees usually do practical work. They organise services, control how things are done, and help implement decisions. If something is broken - a road, a building, a local service - people often expect local power to react.</p>
<p>So, this card is about real life. It is not only about big politics in the capital. It is about how a city or village is managed every day, and how local people can be represented through elections.</p>`, 4),
        mk('en-06', 'The fundamental law of the country (Constitution)', `<p>If I pull this card, I explain the Constitution in very simple words. The Constitution is the fundamental law of the country. It is the main legal document, and it is the base for the political system and all other laws. It tells how the state works, how власти are formed, and what rights citizens have.</p>
<p>According to the text you gave me, the current Constitution of Belarus was adopted on 15 March 1994. It was adopted by the Supreme Council, and later it was amended in national referendums (1996, 2004, and 2022). The Constitution is also called the Fundamental Law of the State. This name is logical, because everything else is built on it - like a building on a foundation.</p>
<p>The Constitution describes the structure of power: the President, Parliament, the Government, and the courts. It explains basic principles, like the rule of law. The rule of law means that the law is above people and institutions, and everyone should follow it. The Constitution also talks about human and civil rights. These rights are important because they protect citizens in their daily life and help them feel safe.</p>
<p>Another important part is democratic procedures - voting and elections. The Constitution explains that public authorities are formed through elections and votes. That means citizens can take part in choosing representatives.</p>
<p>So, when I speak about this card, I say: the Constitution is the main rule book of the country. It gives the structure, the rights, and the basic rules. Without it, laws would be chaotic and people would not know what rules are the most important.</p>`, 5),
        mk('en-07', 'Tractor (agriculture and engineering)', `<p>If I pull the tractor card, I speak about Belarusian agriculture and industry together. A tractor is a strong machine that helps farmers do heavy work. With a tractor, people can plough the soil, plant seeds, carry tools, and help with harvesting. Without tractors and other machines, farming would be much slower and harder.</p>
<p>Belarus is known for engineering and for producing agricultural machinery. In the text you gave, there is an example - Minsk Tractor Works (MTZ). This is a famous enterprise connected with tractors. Tractors are not only for fields. They can also be used in forestry, in коммунальные services, and in construction. The reason is simple: a tractor can use many different attachments. You can add different tools, and the same tractor can do many tasks.</p>
<p>This card also connects to agriculture in Belarus. Belarus produces grain, potatoes, sugar beet, vegetables, and flax. It also produces dairy products, meat, and eggs. Agriculture needs machines, and machines are produced by industry. So, the tractor is like a bridge between two spheres: farming and manufacturing.</p>
<p>A tractor also shows economic ideas like export. If a country produces good tractors, it can sell them abroad. This brings money into the country and supports jobs in factories and service centres.</p>
<p>When I speak about this card, I try to show respect for work. Farming is not easy, and engineering is not easy either. A tractor is a symbol of people who work with their hands and minds. It is also a symbol of стабильность - food security depends on good work in agriculture, and good machines help make this possible.</p>`, 6),
        mk('en-08', 'BelAZ dump truck (heavy industry)', `<p>If I pull the BelAZ card, I speak about heavy industry and huge machines. BelAZ is a Belarusian company known for very big mining dump trucks. These trucks are used in open-pit mines, where they carry rock and heavy materials. They work in very hard conditions, so they must be strong, safe, and reliable.</p>
<p>In the text you gave me, there is a very impressive example: the mine dump truck BelAZ 75710. It can carry up to 450 tonnes of cargo. That is an enormous amount. The truck was shown (unveiled) at a testing field in September 2022, according to your text. It uses an electromechanical transmission powered by alternating current, and it has two diesel engines. It is designed to work in different climates, from minus 50°C to plus 50°C. That means it can work in very cold and very hot places.</p>
<p>The truck has special systems for steering, braking, and dumping. It also has a cabin for two people and safety solutions like ROPS to protect operators if something dangerous happens. Even the tires matter - the text mentions Michelin radial tubeless pneumatic tires on eight wheels. The top speed is about 64 km/h, which is fast for such a massive machine.</p>
<p>This card is a great example of Belarusian engineering. Building a truck like this needs many специалистов: designers, mechanics, electricians, and test engineers. It also shows export potential. Countries with mining industries need such trucks, so this product can be sold around the world.</p>
<p>So, when I speak about this card, I say: this truck is not just transport. It is a symbol of heavy industry, technology, and big-scale production.</p>`, 7),
        mk('en-09', 'High-Tech Park - ICT (the building photo)', `<p>If I pull this card, I talk about modern Belarus - the IT and technology sector. The photo looks like a place connected with high technologies, like offices where people work with computers, software, and digital projects. In Belarus, the ICT sphere is an important modern branch of the economy, because it is based on knowledge and skills, not on heavy machines.</p>
<p>In IT, people create software, mobile apps, websites, and digital services. A big advantage is that these services can be exported easily. You do not need to ship a product in a truck - you can send the result online. That is why IT can connect Belarus with many countries at the same time. It also gives jobs to young people who study mathematics, programming, and foreign languages.</p>
<p>This card also shows the idea of “technological advancement” from your text. Developed economies usually have a skilled workforce and use advanced technologies. IT needs education, training, and постоянное learning. People must update skills, learn new tools, and work in teams. IT also needs good infrastructure - fast internet, good universities, and a business environment that supports new ideas.</p>
<p>Technology influences other industries too. For example, factories use automation, agriculture uses smart equipment, and transport uses digital systems. So, IT is not only its own sphere - it helps the whole country modernise.</p>
<p>When I speak about this card, I keep it simple: it is about brains and ideas. It is about people who create digital products. It is about the future, because many new jobs in the world are connected with technology. And it is also about export, because software can be sold to the world.</p>`, 8),
        mk('en-10', 'Export - Import', `<p>If I pull the “Export - Import” card, I explain these two words in the easiest way. Export means selling goods or services to other countries. Import means buying goods or services from other countries. Every country uses both, because no country can produce everything that people need.</p>
<p>In your text, export is described as an important characteristic of any economy. The text also says the share of export should be higher than the share of import. Countries try to export more because export brings money into the economy and supports local jobs. When a factory produces machines or food and sells it abroad, workers have wages, and the country earns income.</p>
<p>Belarus exports different products. From the information you shared, Belarus is strong in engineering - vehicles, tractors, machinery. Belarus also has food industries, petrochemical products, woodworking, and textiles. Many of these goods can be exported. Belarus also exports some services, and IT services are a good example because they can be sold online.</p>
<p>Import is also normal and needed. A country may import raw materials, parts, technology, or products that are not produced enough inside the country. Import helps factories work, because factories sometimes need foreign parts or materials. Import also helps people get different goods from abroad.</p>
<p>When I speak about this card, I also connect it with the idea of trade. Trade creates connections between countries. It can improve quality, because producers must compete and develop. It can also help the economy grow if the country exports successful products.</p>
<p>So, in simple words: export is “we sell”, import is “we buy”. A good balance helps the economy stay stable and gives people more opportunities.</p>`, 9),
        mk('en-11', 'Industries', `<p>If I pull the “Industries” card, I speak about what Belarus produces and what сферы are important in the economy. Your text says Belarus has a wide structure: manufacturing industries, services sector, and agriculture. This is important because a wide structure means the economy is diversified - it does not depend on only one product.</p>
<p>One of the strongest parts is engineering. Belarus produces vehicles, agricultural machinery, machine tools, electrical equipment, optics, and household appliances. Engineering is important because it creates many jobs and produces goods for export. Another important sphere is electronics. Electronics are used in agriculture, construction, energy, and transport.</p>
<p>Light industry is also developed. It produces fibres and yarn, linen, many kinds of fabric, clothes, bed linen, stockings, tights, and socks. Belarusian textiles and linen are well known, and they can also be exported.</p>
<p>Food industry is very important for food security and for export. The text mentions chocolate, confectionary, baby food, preserves, meat, sugar, juices, vegetable oil, poultry, eggs, and dairy products like milk, cheese, and butter. These goods are part of everyday life, so this industry is always needed.</p>
<p>Woodworking produces furniture, pulp, and paper. Petrochemical industry produces chemical products, coke, petroleum derivatives, plastic, and rubber. Pharmaceutical industry produces medications. Agriculture produces grain, potatoes, sugar beet, vegetables, flax, dairy products, meat, and eggs. Construction builds housing, roads, factories, and social infrastructure like hospitals and schools. The energy industry generates electricity and provides fuel and gas supplies.</p>
<p>So, when I speak about industries, I say: Belarus works in many directions. It produces machines, food, fabrics, chemicals, wood products, and more. This creates jobs, supports export, and helps the country develop.</p>`, 10),
        mk('en-12', '2014 Ice Hockey World Championship in Minsk', `<p>If I pull this card, I speak about a big sports event - the 2014 IIHF World Ice Hockey Championship in Minsk. Hosting a championship is not only about matches. It is also about preparation, infrastructure, гостей, and international attention. Your text says the championship was held from 9 to 25 May, and before it opened, a lot of work had been done.</p>
<p>First, Belarus expected many visitors. For the period from 25 April to 31 May 2014, entry to Belarus was made visa-free for people who had tickets. That made travel easier for fans and guests. Second, security measures were organised. The text says security was a joint effort of different ministries and services. Even if crime rate is low, organisers still create extra security for a big event.</p>
<p>Third, accommodation was prepared. Many hotels and other places were used for teams, officials, journalists, and fans. The text mentions a large number of hotels of different levels, plus halls of residence and even the Fan village. Fourth, venues were prepared. Two main venues were Minsk Arena and Chizhovka Arena. Minsk Arena has 15,000 seats, and Chizhovka Arena has around 10,000 seats.</p>
<p>Fifth, transport infrastructure was improved. Roads, interchanges, metro stations, and even city commuter train service were developed. Volunteers with foreign language skills were recruited and deployed in public places to help guests.</p>
<p>The championship also had symbols. The bison mascot became an important image, because the bison is a Belarusian symbol. Souvenirs, logos, and ads helped create a праздничная atmosphere.</p>
<p>So, when I speak about this card, I say: this event was sport plus organisation. It showed Belarus as a host country and gave Minsk a big international experience.</p>`, 11),
        mk('en-13', 'Michal Kleofas Oginski', `<p>If I pull the Oginski card, I speak about a person who connects politics and art. Michal Kleofas Oginski was a statesman and a military leader, but many people remember him mostly for music. He shows that one person can work for the country and also create culture.</p>
<p>According to the text you gave, he became Ambassador to the Sejm of Poland at a young age, and later he became Head of the Treasury of the Grand Duchy of Lithuania. He was also an Extraordinary Ambassador to the Netherlands. These are serious positions, so he was a very educated and active person. But it is surprising that his most famous “language” today is music, not politics.</p>
<p>He is best remembered for his polonaises, especially the A-minor polonaise “Farewell to the Fatherland.” This music is very emotional. When people listen to it, they often feel sadness, love for home, and respect for the past. The text says the piece was written in his family estate in Zalessie (Grodno region) before he had to leave the country after taking part in the uprising against tsarist Russia. This detail makes the music even more meaningful, because it is connected with real life and real исторические events.</p>
<p>Oginski’s story is also about Belarusian culture inside European culture. Polonaise is a European dance form, but his inspiration came from traditional Belarusian folk songs and the beauty of local culture. That means he combined European style with Belarusian spirit.</p>
<p>So, when I speak about this card, I say: Oginski is a symbol of Belarusian культурный talent. He reminds us that music can keep history and feelings alive. It is amazing how one melody can travel through centuries and still touch people today.</p>`, 12),
        mk('en-14', 'Vladimir Karvat', `<p>If I pull the Vladimir Karvat card, I speak about courage and responsibility. Karvat is remembered because he saved others at the cost of his own life. According to the text you gave, he was flying a training military aircraft on 23 May 1996 when the plane caught fire. In such a situation, the normal order is to eject and save yourself. Karvat was ordered to eject to safety.</p>
<p>But he realised something страшное: if he ejected immediately, the plane could crash on villages. That would put many civilians in danger. So he made a decision that showed great humanity. He steered the plane away from the settlements until the moment of crash. The text says the plane crashed one kilometre from the settlements of Arabovshchyna and Bolshoye Gatishche in Brest region. Karvat died, but people in the villages lived.</p>
<p>Later, on 21 November 1996, he was posthumously awarded the title Hero of Belarus. “Posthumously” means after death. This award is not only about bravery in the air. It is about moral strength. It shows that he thought first about other people, not only about himself.</p>
<p>This story is powerful because it is very human. It is not about politics or money. It is about a person who had only seconds to choose, and he chose to protect others. For many people, this is the highest form of duty. It is also a lesson: real heroism can happen quietly, without any plan, in one difficult moment.</p>
<p>So, when I speak about this card, I say: Vladimir Karvat is worthy of admiration. It is unbelievable how much courage and care for people he had. His name is part of modern Belarusian history, and it reminds us what responsibility can mean.</p>`, 13),
        mk('en-15', 'Darya Domracheva', `<p>If I pull the Darya Domracheva card, I speak about modern Belarusian sport and strong character. Domracheva is a famous Belarusian biathlete. Biathlon is not an easy sport, because it combines two very different skills. First you must ski very fast for many kilometres. Then you must stop and shoot at targets with спокойные hands. If you are tired and stressed, shooting becomes very difficult. So biathlon needs both physical power and mental control.</p>
<p>According to your text, Domracheva has competed in the Biathlon World Cup since 2006. That means many years of hard training and competition. Athletes like her train almost every day. They work in cold weather, they travel to different countries, and they must keep discipline for a long time. Success in biathlon is not luck - it is постоянный work.</p>
<p>Her biggest moment for many fans was the 2014 Winter Olympics in Sochi. The text says she won three gold medals: in the women’s 10 km pursuit, the women’s 15 km individual race, and the 12.5 km mass start. Three gold medals at one Olympics is a huge result. It is amazing, because Olympic pressure is enormous. The world watches you, and one mistake can change everything.</p>
<p>Her victories gave Belarus a strong image in winter sport. Many people felt proud, because they saw Belarusian flag and heard Belarusian name at the top level. Her success also inspired young athletes. When children see a champion from their country, they believe they can do it too.</p>
<p>So, when I speak about this card, I say: Domracheva is a symbol of focus and strength. She shows what discipline can bring. It is impressive how she could be fast, calm, and brave at the same time.</p>`, 14),
        mk('en-16', 'Pavel Sukhoi', `<p>If I pull the Pavel Sukhoi card, I speak about science, engineering, and big ideas. Pavel Sukhoi was an aerospace engineer and an aircraft designer. He worked in aviation and helped create many aircraft solutions. In the text you gave, he is described as an inventor and the founder of the Sukhoi Design Bureau. His name is connected with Sukhoi military aircraft, which are famous in the world of авиация.</p>
<p>Aircraft design is a very complex area. To build a plane, you need mathematics, physics, materials science, and a lot of testing. A designer must think about speed, safety, fuel, control systems, and the comfort and protection of pilots. Even small details can matter. Sukhoi worked on supersonic jets - planes that can fly faster than the speed of sound. This is a high level of technology, and it needs deep knowledge and years of experiments.</p>
<p>The text says he designed more than 50 original aircraft solutions, and more than 30 of them were constructed and tested. That means his ideas were not only theory. They were real machines that flew and were checked in practice. This is impressive, because not every idea becomes a real working aircraft. Many ideas fail, and engineers must start again. Sukhoi’s work shows persistence and strong scientific thinking.</p>
<p>His story also shows that Belarus has people who influenced world technology. When we talk about famous Belarusians, we can talk not only about culture and sport, but also about science and engineering.</p>
<p>So, when I speak about this card, I say: Pavel Sukhoi represents the power of knowledge. He helped build advanced aircraft and pushed technology forward. It is really impressive how one person’s work can influence an entire field for decades.</p>`, 15),

    function getOrCreateMainCatId(){

      const path = [];

      let guard = 0;
      while(cur && guard++ < 30){
        path.unshift(cur.name);
        cur = cur.parentId ? catById(cur.parentId) : null;
      }
      return path.length ? path.join(' / ') : '-';
    }

    function noteMatchesSearch(note){
      if(!state.search) return true;
      const s = state.search.toLowerCase();
      const t = (note.title || '').toLowerCase();
      const body = htmlToText(note.html).toLowerCase();
      return t.includes(s) || body.includes(s);
    }

    function countNotesInCat(catId, includeChildren=true){
      let ids = new Set([catId]);
      if(includeChildren){
        let changed = true;
        while(changed){
          changed = false;
          for(const c of state.cats){
            if(c.parentId && ids.has(c.parentId) && !ids.has(c.id)){
              ids.add(c.id); changed = true;
            }
          }
        }
      }
      return state.notes.filter(n => ids.has(n.catId)).length;
    }

        if(!byParent.has(k)) byParent.set(k, []);

        arr.sort((a,b) => (a.name||'').localeCompare(b.name||''));
      }

      catTree.innerHTML = '';

      function getCatPathIds(activeId){

        while(cur){
          out.push(String(cur.id));
          cur = cur.parentId ? byId.get(String(cur.parentId)) : null;
        }
        return out.reverse();

          const names = pathArr.map(id => (byId.get(String(id))?.name || '-'));
          catBreadcrumb.textContent = names.join(' › ');
        }
      }

      function buildList(parentId, depth){
        const ul = document.createElement('ul');
        const key = parentId || '__root__';
        const kids = byParent.get(key) || [];
        kids.forEach(cat => {
          const li = document.createElement('li');

          const row = document.createElement('div');
          row.className = 'tree-item' + (cat.id === state.activeCatId ? ' is-active' : '') + (pathIds.has(String(cat.id)) ? ' is-path' : '');
          row.dataset.id = cat.id;
          row.tabIndex = 0;
          row.setAttribute('role','treeitem');

          row.dataset.depth = String(depth);
const hasChildren = (byParent.get(cat.id) || []).length > 0;
          const isCollapsed = hasChildren && state.ui.collapsedCats.has(String(cat.id));

          const tgl = document.createElement('button');
          tgl.type = 'button';
          tgl.className = 'tree-tgl';
          tgl.textContent = hasChildren ? (isCollapsed ? '▸' : '▾') : '•';
          if(hasChildren){
tgl.addEventListener('click', (e) => {
              e.stopPropagation();
              const id = String(cat.id);
              if(state.ui.collapsedCats.has(id)) state.ui.collapsedCats.delete(id);
              else state.ui.collapsedCats.add(id);
              saveCollapsedCats(state.ui.collapsedCats);
              renderTree();
            });
          }

          const name = document.createElement('div');
          name.className = 'tree-name';
          name.textContent = cat.name || '-';

          const cnt = document.createElement('div');
          cnt.className = 'tree-count';
          cnt.textContent = String(countNotesInCat(cat.id, false));

          row.appendChild(tgl);
          row.appendChild(name);
          row.appendChild(cnt);

          row.addEventListener('click', (e) => {
            state.activeCatId = cat.id;

            const list = getVisibleNotes();
            if(list.length){
              state.activeNoteId = list[0].id;
            } else {
              state.activeNoteId = null;
            }
            renderAll();
            setTimeout(() => { try{ editor.focus(); }catch(e){} }, 0);
            closeDrawerSoon && closeDrawerSoon();
          });

          row.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' || e.key === ' '){
              e.preventDefault();
              row.click();
            }
            if(e.key === 'ArrowLeft'){
              if(hasChildren && !isCollapsed){
                e.preventDefault();
                const id = String(cat.id);
                state.ui.collapsedCats.add(id);
                saveCollapsedCats(state.ui.collapsedCats);
                renderTree();
              }
            }
            if(e.key === 'ArrowRight'){
              if(hasChildren && isCollapsed){
                e.preventDefault();
                const id = String(cat.id);
                state.ui.collapsedCats.delete(id);
                saveCollapsedCats(state.ui.collapsedCats);
                renderTree();
              }
            }
          });

          li.appendChild(row);

           if(hasChildren && !isCollapsed){
             const sub = buildList(cat.id, depth+1);
             sub.classList.add('indent');
             li.appendChild(sub);
           }

          ul.appendChild(li);
        });
        return ul;
      }

      wrap.appendChild(buildList(null, 0));
      catTree.appendChild(wrap);
    }

    function renderEditor(){
      const note = state.activeNoteId ? noteById(state.activeNoteId) : null;
      const cat = state.activeCatId ? catById(state.activeCatId) : null;

      crumbs.textContent = state.activeCatId ? catPath(state.activeCatId) : '-';

      if(!note){
        noteTitle.value = '';
        // Можно начинать печатать сразу - при первом вводе заметка и категория создадутся автоматически
        noteTitle.disabled = false;
        // Не блокируем редактор: пусть пользователь сразу пишет, даже если нет ни одной категории/заметки
        if(!editor.innerHTML.trim()) editor.innerHTML = '<p></p>';
        editor.setAttribute('contenteditable', 'true');
        updatedText.textContent = '-';
        return;
      }


      noteTitle.disabled = false;
      editor.setAttribute('contenteditable','true');

      // avoid resetting cursor if already on same note and active element is editor
      if(noteTitle.value !== (note.title || '')) noteTitle.value = note.title || '';
      if(editor.dataset.noteId !== note.id){
        editor.innerHTML = note.html || '';
        editor.dataset.noteId = note.id;

    // ========= autosave =========
    async function persistAll(){
      state.saving = true;
      setSaveStatus('saving');
      try{
        // write cats and notes
        await idbTx('readwrite',[STORE.cats, STORE.notes], st => {
          state.cats.forEach(c => st[STORE.cats].put(c));
          state.notes.forEach(n => st[STORE.notes].put(n));
        });
        state.lastSavedAt = now();
        state.dirty = false;
        setSaveStatus('saved');
      }catch(e){
        setSaveStatus('dirty');
      }finally{
        state.saving = false;
      }
    }

    function schedulePersist(delay=450){
      state.dirty = true;
      setSaveStatus('dirty');
      if(state.saveTimer) clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(async () => {
        await persistAll();
        // push cloud after local save
        if(state.cloud.mode !== 'off'){
          scheduleCloudPush();
        }
      }, delay);
    }

    function saveSelection(){
      try{
        const sel = window.getSelection ? window.getSelection() : null;
        if(!sel || sel.rangeCount === 0) return;
        const r = sel.getRangeAt(0);
        const common = r.commonAncestorContainer;
        const node = (common.nodeType === 1) ? common : common.parentNode;
        if(!node || !editor.contains(node)) return;
        lastSelRange = r.cloneRange();
      }catch(e){}
    }

    function restoreSelection(){
      if(!lastSelRange) return false;
      try{
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(lastSelRange);
        return true;
      }catch(e){

    }

// ========= editor selection-based formatting (2026-01) =========
    function getSelRange(){
      const sel = window.getSelection ? window.getSelection() : null;
      if(!sel || sel.rangeCount === 0) return null;
      const r = sel.getRangeAt(0);
      // Ensure selection is inside editor
      const common = r.commonAncestorContainer;
      const node = (common.nodeType === 1) ? common : common.parentNode;
      if(!node || !editor.contains(node)) return null;

    function cssTextFromObj(obj){
      return Object.entries(obj || {})
        .filter(([k,v]) => v !== null && v !== undefined && String(v).trim() !== '')
        .map(([k,v]) => `${k}:${String(v).trim()}`)
        .join(';');
    }

    function insertStyledCaretSpan(styles){
      const r = getSelRange();
      if(!r) return false;

      // create <span style="...">\u200B</span> and place caret after the ZWSP
      const span = document.createElement('span');
      span.setAttribute('style', cssTextFromObj(styles));
      span.textContent = '\u200B';
      r.deleteContents();
      r.insertNode(span);

      const sel = window.getSelection();
      const nr = document.createRange();
      nr.setStart(span.firstChild, 1);
      nr.collapse(true);
      sel.removeAllRanges();
      sel.addRange(nr);
      return true;
    }

    function wrapRangeWithSpan(range, styles){
      const span = document.createElement('span');
      span.setAttribute('style', cssTextFromObj(styles));

      // Extract selected contents, wrap, then insert back
      const frag = range.extractContents();
      span.appendChild(frag);
      range.insertNode(span);

      // Reselect wrapped contents
      const sel = window.getSelection();
      const nr = document.createRange();
      nr.selectNodeContents(span);
      sel.removeAllRanges();
      sel.addRange(nr);
      return span;
    }

    function applyStyleToSelection(styles, opts={}){
      focusEditor();
      restoreSelection();
      const r = getSelRange();
      if(!r){
        // selection outside editor: just set defaults if requested
        if(opts.alsoSetDefault){
          if(styles['font-family']) setFontFamily(styles['font-family']);
          if(styles['font-size']) setFontSize(styles['font-size'].replace('px',''));
        }
        return;
      }

      if(r.collapsed){
        insertStyledCaretSpan(styles);
      } else {
        wrapRangeWithSpan(r, styles);
      }

      // Optionally set defaults for overall editor (so new text feels consistent)
      if(opts.alsoSetDefault){
        if(styles['font-family']) setFontFamily(styles['font-family']);
        if(styles['font-size']) setFontSize(String(styles['font-size']).replace('px',''));
      }

      schedulePersist();
    }

    function applyFontSizeToSelection(px, opts={}){

    // Normalize: remove leftover <font> tags (from execCommand), and cleanup ZWSP spans if possible
    
function sanitizeEditorHTML(){
      try{
        // Replace <font> tags with spans while preserving color/face/size attributes
        editor.querySelectorAll('font').forEach(f => {
          const s = document.createElement('span');
          const styles = [];
          const color = f.getAttribute('color');
          const face = f.getAttribute('face');
          const size = f.getAttribute('size');
          if(color) styles.push('color:' + color);
          if(face) styles.push('font-family:' + face);
          // size is 1-7 (legacy) - ignore; user uses px controls
          if(styles.length) s.setAttribute('style', styles.join(';'));
          s.innerHTML = f.innerHTML;
          f.replaceWith(s);
        });

        // Remove spans that contain only ZWSP and no other text, after user typed
        editor.querySelectorAll('span').forEach(sp => {
          if(sp.textContent === '\u200B'){
            // keep if it's the caret carrier currently selected
            const sel = window.getSelection();
            const node = sel && sel.anchorNode;
            if(node && sp.contains(node)) return;
            sp.remove();
          }
        });

        // Normalize images into figure "objects" (drag/resize/wrap)
        try{ normalizeImageBlocks(); }catch(e){}
      }catch(e){}

    // ========= image handling =========
    async function fileToDataURL(file){
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = () => reject(fr.error);
        fr.readAsDataURL(file);
      });
    }

    
    async function insertImageFromFile(file){
      if(!file) return;

      const dataUrl = await fileToDataURL(file);

      // compute reasonable default size (keeps aspect ratio)
      let natW = 0, natH = 0, ratio = 0;
      try{
        const tmp = new Image();
        tmp.src = dataUrl;
        // decode() is best-effort (not supported everywhere)
        if(tmp.decode) await tmp.decode();
        natW = Number(tmp.naturalWidth || 0);
        natH = Number(tmp.naturalHeight || 0);
        if(natW > 0 && natH > 0) ratio = natH / natW;
      }catch(e){}

      const editorW = Math.max(240, editor.clientWidth || editor.getBoundingClientRect().width || 640);
      const maxW = Math.max(200, Math.floor(editorW - 32));
      let w = Math.floor(editorW * 0.62);
      w = clamp(w, 220, Math.min(720, maxW));
      let h = ratio ? Math.floor(w * ratio) : Math.floor(w * 0.66);
      h = clamp(h, 120, 2000);

      focusEditor();
      restoreSelection();

      const alt = (file && file.name) ? file.name : 'image';
      const escAttr = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');

      const figHtml =
        `<figure class="onoi-img" data-mode="center" contenteditable="false" style="width:${w}px;height:${h}px" data-onoi-img="1">` +
          `<img src="${escAttr(dataUrl)}" alt="${escAttr(alt)}" draggable="false">` +
        `</figure>` +
        `<p><br></p>`;

      try{
        document.execCommand('insertHTML', false, figHtml);
      }catch(e){
        // fallback: append at end
        const fig = document.createElement('figure');
        fig.className = 'onoi-img';
        fig.setAttribute('data-mode','center');
        fig.setAttribute('contenteditable','false');
        fig.setAttribute('data-onoi-img','1');
        fig.style.width = w + 'px';
        fig.style.height = h + 'px';
        clampFigToEditor(fig);
        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = alt;
        img.draggable = false;
        fig.appendChild(img);
        editor.appendChild(fig);
        const p = document.createElement('p');
        p.appendChild(document.createElement('br'));
        editor.appendChild(p);
      }

      sanitizeEditorHTML();
      saveSelection();
      schedulePersist();
    }

    function getModeMaxWidth(mode){
      const rect = editor.getBoundingClientRect();
      const editorW = Math.max(240, editor.clientWidth || rect.width || 640);
      const m = (mode === 'left' || mode === 'right') ? 14 : (mode === 'inline' ? 12 : 0);
      return Math.max(140, Math.floor(editorW - m - 6));
    }
    function clampFigToEditor(fig){
      if(!fig) return;
      const mode = fig.dataset.mode || 'center';
      const maxW = getModeMaxWidth(mode);

      let w = parseFloat(fig.style.width || '') || 0;
      let h = parseFloat(fig.style.height || '') || 0;
      if(!(w > 0 && h > 0)){
        try{
          const r = fig.getBoundingClientRect();
          w = r.width || w;
          h = r.height || h;
        }catch(e){}
      }
      if(!(w > 0 && h > 0)) return;

      if(w > maxW){
        const ratio = w / h;
        const newW = maxW;
        const newH = newW / ratio;
        fig.style.width = Math.round(newW) + 'px';
        fig.style.height = Math.round(newH) + 'px';
      }
    }
    function ensureTrailingParagraph(){
      const last = editor.lastChild;
      if(!last) {
        const p = document.createElement('p');
        p.appendChild(document.createElement('br'));
        editor.appendChild(p);
        return;
      }
      // If the last node is an image object - add an empty paragraph so caret/drop can land after it
      if(last.nodeType === 1 && last.matches && last.matches('figure.onoi-img')){
        const p = document.createElement('p');
        p.appendChild(document.createElement('br'));
        editor.appendChild(p);
      }
    }

    function normalizeImageBlocks(){
      // 1) Wrap bare <img> into <figure class="onoi-img"...> objects
      const bareImgs = Array.from(editor.querySelectorAll('img')).filter(im => !im.closest('figure.onoi-img'));
      for(const im of bareImgs){
        const src = im.getAttribute('src') || '';
        if(!src) continue;

        // Use current rendered size if possible
        let rect = null;
        try{ rect = im.getBoundingClientRect(); }catch(e){}
        const editorW = Math.max(240, editor.clientWidth || editor.getBoundingClientRect().width || 640);
        const maxW = Math.max(200, Math.floor(editorW - 32));
        let w = rect && rect.width ? Math.round(rect.width) : Math.round(clamp(editorW * 0.62, 220, Math.min(720, maxW)));
        let h = rect && rect.height ? Math.round(rect.height) : Math.round(w * 0.66);
        w = clamp(w, 120, maxW);
        h = clamp(h, 80, 4000);

        const fig = document.createElement('figure');
        fig.className = 'onoi-img';
        fig.setAttribute('data-mode', 'center');
        fig.setAttribute('contenteditable', 'false');
        fig.setAttribute('data-onoi-img', '1');
        fig.style.width = w + 'px';
        fig.style.height = h + 'px';
        clampFigToEditor(fig);

        im.draggable = false;
        // reset inline sizing so figure controls size
        im.style.width = '100%';
        im.style.height = '100%';
        im.style.maxWidth = '100%';
        im.style.display = 'block';
        im.style.margin = '0';

        // If inside <p>, split paragraph around image to avoid invalid p>figure nesting
        const p = im.parentElement && im.parentElement.tagName === 'P' ? im.parentElement : null;
        if(p){
          const before = document.createElement('p');
          const after = document.createElement('p');
          let hit = false;
          Array.from(p.childNodes).forEach(ch => {
            if(ch === im){ hit = true; return; }
            (hit ? after : before).appendChild(ch);
          });
          fig.appendChild(im);

          const frag = document.createDocumentFragment();
          if(before.textContent.trim() || before.querySelector('br') || before.childNodes.length) frag.appendChild(before);
          frag.appendChild(fig);
          if(after.textContent.trim() || after.querySelector('br') || after.childNodes.length) frag.appendChild(after);
          else{
            const tail = document.createElement('p');
            tail.appendChild(document.createElement('br'));
            frag.appendChild(tail);
          }
          p.replaceWith(frag);
        } else {
          fig.appendChild(im);
          im.replaceWith(fig);
        }
      }

      // 2) Normalize existing figures
      editor.querySelectorAll('figure.onoi-img').forEach(fig => {
        fig.setAttribute('contenteditable','false');
        fig.setAttribute('data-onoi-img','1');
        if(!fig.dataset.mode) fig.dataset.mode = 'center';

        const img = fig.querySelector('img');
        if(img){
          img.draggable = false;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.maxWidth = '100%';
          img.style.display = 'block';
          img.style.margin = '0';
        }

        // Ensure width/height exist
        const w = parseFloat(fig.style.width || '') || 0;
        const h = parseFloat(fig.style.height || '') || 0;
        if(!(w > 0 && h > 0)){
          let rect = null;
          try{ rect = fig.getBoundingClientRect(); }catch(e){}
          const ww = rect && rect.width ? Math.round(rect.width) : 360;
          const hh = rect && rect.height ? Math.round(rect.height) : 240;
          fig.style.width = clamp(ww, 120, 2000) + 'px';
          fig.style.height = clamp(hh, 80, 3000) + 'px';
        }
        clampFigToEditor(fig);
      });
      ensureTrailingParagraph();
    }

    function caretRangeFromPoint(x,y){
      const rect = editor.getBoundingClientRect();
      const cx = clamp(x, rect.left + 2, rect.right - 2);
      const cy = clamp(y, rect.top + 2, rect.bottom - 2);

      let r = null;

      // Firefox - caretPositionFromPoint
      if(document.caretPositionFromPoint){
        const pos = document.caretPositionFromPoint(cx, cy);
        if(pos){
          r = document.createRange();
          try{
            r.setStart(pos.offsetNode, pos.offset);

          }catch(e){ r = null; }
        }
      } else if(document.caretRangeFromPoint){
        try{ r = document.caretRangeFromPoint(cx, cy); }catch(e){ r = null; }
      }

      if(r && r.startContainer && editor.contains(r.startContainer)) return r;

      // If the point is inside editor (incl. empty bottom area) - fall back to end
      if(cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom){
        try{
          const end = document.createRange();
          end.selectNodeContents(editor);
          end.collapse(false);
          return end;
        }catch(e){}
      }
      return null;
