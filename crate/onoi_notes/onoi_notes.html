    function moveMarkerToPoint(x,y){
      const edRect = editor.getBoundingClientRect();
      const marker = ensureDropMarker();

      // Allow drop into empty bottom area - always treat as end of document
      if(y >= edRect.bottom - 24){
        editor.appendChild(marker);
        return;
      }

      const r = caretRangeFromPoint(x,y);
      if(!r){
        editor.appendChild(marker);
        return;
      }

      let node = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode;
      if(!node){
        editor.appendChild(marker);
        return;
      }

      const fig = node.closest && node.closest('figure.onoi-img') ? node.closest('figure.onoi-img') : null;
      if(fig) node = fig;

      let top = topLevelChild(node);
      if(!top){
        editor.appendChild(marker);
        return;
      }

      if(imgDrag && top === imgDrag.fig) return;

      const rect = top.getBoundingClientRect();
      const before = y < (rect.top + rect.height / 2);
      editor.insertBefore(marker, before ? top : top.nextSibling);
    }

    editor.addEventListener('pointerdown', (ev) => {
      if(ev.button !== 0) return;
      const fig = ev.target && ev.target.closest ? ev.target.closest('figure.onoi-img') : null;
      if(!fig || !editor.contains(fig)) return;

      // Don't start drag when user is resizing (overlay handles)
      if(ev.target.closest('.onoi-img-overlay') || ev.target.closest('.onoi-img-bubble')) return;

      imgDrag = { fig, x: ev.clientX, y: ev.clientY, moved: false, pid: ev.pointerId };
      try{ fig.setPointerCapture(ev.pointerId); }catch(e){}
    });

    editor.addEventListener('pointermove', (ev) => {
      if(!imgDrag) return;
      const dx = ev.clientX - imgDrag.x;
      const dy = ev.clientY - imgDrag.y;
      if(!imgDrag.moved){
        if(Math.hypot(dx,dy) < 4) return;
        imgDrag.moved = true;
        try{ imgDrag.fig.classList.add('is-dragging'); }catch(e){}
        ensureDropMarker();
      }
      ev.preventDefault();
      moveMarkerToPoint(ev.clientX, ev.clientY);
    });

    editor.addEventListener('pointerup', (ev) => {
      if(!imgDrag) return;
      const fig = imgDrag.fig;
      const moved = imgDrag.moved;
      imgDrag = null;

      try{ fig.classList.remove('is-dragging'); }catch(e){}

      if(!moved){
        return;
      }
      ev.preventDefault();
      if(dropMarker && dropMarker.parentNode){
        dropMarker.parentNode.insertBefore(fig, dropMarker);
        removeDropMarker();
        sanitizeEditorHTML();
        schedulePersist();
        selectImg(fig);
      } else {
        removeDropMarker();
      }
    });

    editor.addEventListener('pointercancel', () => {
      try{ if(imgDrag && imgDrag.fig) imgDrag.fig.classList.remove('is-dragging'); }catch(e){}
      imgDrag = null;
      removeDropMarker();
    });

    // -------------------------
    // Resize handles (overlay)
    // -------------------------
    let resizeState = null;

    imgOverlay.addEventListener('pointerdown', (ev) => {
      const h = ev.target && ev.target.closest ? ev.target.closest('.h') : null;
      if(!h || !selectedImgFig) return;

      ev.preventDefault();
      ev.stopPropagation();

      const pos = h.dataset.pos || 'se';
      const rect = selectedImgFig.getBoundingClientRect();
      const ratio = rect.width > 0 && rect.height > 0 ? (rect.width / rect.height) : 1.4;

      resizeState = {
        pos,
        startX: ev.clientX,
        startY: ev.clientY,
        startW: rect.width,
        startH: rect.height,
        ratio,
        pid: ev.pointerId
      };
      try{ imgOverlay.setPointerCapture(ev.pointerId); }catch(e){}
    });

    imgOverlay.addEventListener('pointermove', (ev) => {
      if(!resizeState || !selectedImgFig) return;
      ev.preventDefault();

      const dx = ev.clientX - resizeState.startX;
      const dy = ev.clientY - resizeState.startY;
      const pos = resizeState.pos;
      const ratio = resizeState.ratio || 1.4;

      let newW = resizeState.startW;
      let newH = resizeState.startH;

      const hasE = pos.includes('e');
      const hasW = pos.includes('w');
      const hasN = pos.includes('n');
      const hasS = pos.includes('s');

      if(hasE) newW = resizeState.startW + dx;
      if(hasW) newW = resizeState.startW - dx;
      if(hasS) newH = resizeState.startH + dy;
      if(hasN) newH = resizeState.startH - dy;

      // lock aspect ratio, but allow both directions
      if(pos.length === 2){
        const wFromH = newH * ratio;
        const hFromW = newW / ratio;
        if(Math.abs(newW - resizeState.startW) > Math.abs(newH - resizeState.startH)){
          newH = hFromW;
        } else {
          newW = wFromH;
        }
      } else if(pos === 'e' || pos === 'w'){
        newH = newW / ratio;
      } else if(pos === 'n' || pos === 's'){
        newW = newH * ratio;
      }

      const maxW = getModeMaxWidth(selectedImgFig.dataset.mode || 'center');
      newW = clamp(newW, 120, maxW);
      newH = clamp(newH, 80, 6000);

      // keep ratio exact after clamping
      newH = newW / ratio;

      selectedImgFig.style.width = Math.round(newW) + 'px';
      selectedImgFig.style.height = Math.round(newH) + 'px';

      updateImgUI();
    });

    imgOverlay.addEventListener('pointerup', () => {
      if(!resizeState) return;
      resizeState = null;
      sanitizeEditorHTML();
      schedulePersist();
    });
    imgOverlay.addEventListener('pointercancel', () => {
      if(!resizeState) return;
      resizeState = null;
      sanitizeEditorHTML();
      schedulePersist();
    });

    // -------------------------
    // Drop image files from OS into editor
    // -------------------------
    editor.addEventListener('dragover', (ev) => {
      if(ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length){
        ev.preventDefault();
      }
    });
    editor.addEventListener('drop', async (ev) => {
      const dt = ev.dataTransfer;
      const files = (dt && dt.files) ? Array.from(dt.files) : [];
      const imgFile = files.find(f => f && f.type && f.type.startsWith('image/'));
      if(!imgFile) return;
      ev.preventDefault();

      // place caret at drop point
      const r = caretRangeFromPoint(ev.clientX, ev.clientY);
      if(r){
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        saveSelection();
      }
      await insertImageFromFile(imgFile);
    });


    // Normalize when switching notes (renderEditor changes editor.dataset.noteId)
    try{
      const mo = new MutationObserver((muts) => {
        for(const m of muts){
          if(m.type === 'attributes' && (m.attributeName === 'data-note-id' || m.attributeName === 'data-noteid')){
            try{ normalizeImageBlocks(); }catch(e){}
            try{ hideImgUI(); }catch(e){}
            break;
          }
        }
      });
      mo.observe(editor, { attributes:true, attributeFilter:['data-note-id','data-noteid'] });
    }catch(e){}

    // Run once on load and on each renderEditor (history layer might re-render)
    setTimeout(() => { try{ normalizeImageBlocks(); }catch(e){} }, 0);

// ========= note operations =========
    

function ensureCategoryForNewNote(){
  // Notes must always belong to a real category.
  // If there are no categories at all - recreate root "main".
  // If active category is missing (deleted) - fallback to "main".
  const hadNoCats = state.cats.length === 0;
  const activeMissing = !state.activeCatId || !catById(state.activeCatId);
  if(hadNoCats || activeMissing){
    const mainId = getOrCreateMainCatId();
    state.activeCatId = mainId;
    // If we created categories implicitly - update tree + breadcrumbs immediately
    renderTree();
    crumbs.textContent = catPath(state.activeCatId);
  }
  return state.activeCatId;
}
async function createNote(){
      ensureCategoryForNewNote();

      const n = { id: uid(), catId: state.activeCatId, title: '', html: '<p></p>', createdAt: now(), updatedAt: now() };
      state.notes.unshift(n);
      state.activeNoteId = n.id;
      renderNotesList();
      renderEditor();
      editor.focus();
      schedulePersist();
    }

    function ensureActiveNoteFromDraft(){
      if(state.activeNoteId) return noteById(state.activeNoteId);

      ensureCategoryForNewNote();

const draftTitle = (noteTitle.value || '').trim();
      const draftHtml = (editor.innerHTML && editor.innerHTML.trim()) ? editor.innerHTML : '<p></p>';
      const n = { id: uid(), catId: state.activeCatId, title: draftTitle, html: draftHtml, createdAt: now(), updatedAt: now() };
      state.notes.unshift(n);
      state.activeNoteId = n.id;
      renderNotesList();
      schedulePersist();
      return n;
    }

	async function deleteActiveNote(){
      const note = state.activeNoteId ? noteById(state.activeNoteId) : null;
      if(!note) return;
      if(!(await uiConfirm('Удалить заметку?', 'onoi_notes'))) return;

      state.notes = state.notes.filter(n => n.id !== note.id);
      await idb.del(STORE.notes, note.id);

      const vis = getVisibleNotes();
      state.activeNoteId = vis[0]?.id || null;
      renderAll();
      schedulePersist(50);
    }

    async function createCategory(parentId=null){
      const name = await uiPrompt(parentId ? 'Название подкатегории:' : 'Название категории:', {title:'onoi_notes', label:'Название'});
      if(!name) return;
      const c = { id: uid(), parentId: parentId, name: name.trim(), createdAt: now(), updatedAt: now() };
      state.cats.push(c);
      state.activeCatId = c.id;
      renderAll();
      schedulePersist();
    }

    async function renameActiveCategory(){
      const c = state.activeCatId ? catById(state.activeCatId) : null;
      if(!c) return;
      const name = await uiPrompt('Новое имя:', c.name || '', {title:'onoi_notes', label:'Название'});
      if(!name) return;
      c.name = name.trim();
      c.updatedAt = now();
      renderTree();
      crumbs.textContent = catPath(state.activeCatId);
      schedulePersist();
    }

    async function deleteActiveCategory(){
      const c = state.activeCatId ? catById(state.activeCatId) : null;
      if(!c) return;
      const count = countNotesInCat(c.id, true);
      if(!(await uiConfirm('Удалить категорию и всё внутри?\nЗаметок затронется: ' + count, 'onoi_notes'))) return;

      // collect cat ids to delete
      const toDel = new Set([c.id]);
      let changed = true;
      while(changed){
        changed = false;
        for(const cc of state.cats){
          if(cc.parentId && toDel.has(cc.parentId) && !toDel.has(cc.id)){
            toDel.add(cc.id); changed = true;
          }
        }
      }
      state.cats = state.cats.filter(x => !toDel.has(x.id));
      state.notes = state.notes.filter(n => !toDel.has(n.catId));

      await idbTx('readwrite',[STORE.cats, STORE.notes], st => {
        toDel.forEach(id => st[STORE.cats].delete(id));
        // delete notes in those cats
        // brute force: clear all notes store then re-put current (simple + safe)
      });

      // re-sync stores (simple strategy)
      await idb.clear(STORE.cats);
      await idb.clear(STORE.notes);
      await idbTx('readwrite',[STORE.cats, STORE.notes], st => {
        state.cats.forEach(ca => st[STORE.cats].put(ca));
        state.notes.forEach(no => st[STORE.notes].put(no));
      });

      state.activeCatId = state.cats[0]?.id || null;
      const vis = getVisibleNotes();
      state.activeNoteId = vis[0]?.id || null;
      renderAll();
      schedulePersist(50);
    }

    // ========= export/import =========
    function currentDBSnapshot(){
      return {
        version: 1,
        exportedAt: new Date().toISOString(),
        cats: state.cats,
        notes: state.notes
      };
    }

    function downloadJSON(obj, filename){
      const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function importJSON(obj, opts){
      if(!obj || typeof obj !== 'object') throw new Error('Bad JSON');
      if(!Array.isArray(obj.cats) || !Array.isArray(obj.notes)) throw new Error('No cats/notes arrays');
      opts = opts || {};
      const doRender = (opts.render !== false);


      // very light validation
      const cats = obj.cats.map(c => ({
        id: String(c.id || uid()),
        parentId: c.parentId ? String(c.parentId) : null,
        name: String(c.name || '-'),
        createdAt: Number(c.createdAt || now()),
        updatedAt: Number(c.updatedAt || now())
      }));
      const catIds = new Set(cats.map(c => c.id));
      const notes = obj.notes.map(n => ({
        id: String(n.id || uid()),
        catId: catIds.has(String(n.catId)) ? String(n.catId) : (cats[0]?.id || null),
        title: String(n.title || '-'),
        html: String(n.html || ''),
        createdAt: Number(n.createdAt || now()),
        updatedAt: Number(n.updatedAt || now())
      }));

      state.cats = cats;
      state.notes = notes;
      ensureDefaults();

      await idb.clear(STORE.cats);
      await idb.clear(STORE.notes);
      await idbTx('readwrite',[STORE.cats, STORE.notes], st => {
        state.cats.forEach(c => st[STORE.cats].put(c));
        state.notes.forEach(n => st[STORE.notes].put(n));
      });

      if(doRender){
        renderAll();
        schedulePersist(50);
      }
    }

    // ========= whisperer transport =========
    async function whisperSelectedOrActive(){
      let note = null;

      if(state.activeNoteId){
        note = noteById(state.activeNoteId);
      } else {
        // No active note: only create one if there's real draft text
        const draftText = htmlToText(editor.innerHTML || '');
        if(!draftText || !draftText.trim()){
          toast('whisper', 'Нет текста для whisperer.', {ttl: 2600});
          return;
        }
        note = ensureActiveNoteFromDraft();
      }

      if(!note){
        toast('whisper', 'Нет активной заметки.', {ttl: 2600});
        return;
      }

      // Capture latest editor state before leaving
      try{
        note.title = (noteTitle.value || '').trim();
        note.html = editor.innerHTML || '';
        note.updatedAt = now();
      }catch(e){}

      const text = htmlToText(note.html);
      if(!text || !text.trim()){
        toast('whisper', 'Нет текста для whisperer.', {ttl: 2600});
        return;
      }

      // Best-effort persist to avoid any loss on navigation
      try{ await persistAll(); }catch(e){ /* ignore */ }

      // Store payload for whisperer (primary transport)
      const payload = { mode:'single', noteIds:[note.id], text:text, createdAt: now() };
      try{ localStorage.setItem('onoi_whisper_payload_v1', JSON.stringify(payload)); }catch(e){}

      // Navigate (secondary transport via URL for short texts)
      try{
        const u = new URL('../whisperer/whisperer.html', window.location.href);
        u.searchParams.set('from','onoi_notes');
        if(text.length <= 2000){
          u.searchParams.set('text', text);
        }
        window.location.href = u.toString();
      }catch(e){
        window.location.href = '../whisperer/whisperer.html?from=onoi_notes';
      }
    }

    // ========= cloud sync =========
    function cloudHeaders(){
      const h = { 'Accept': 'application/vnd.github+json' };
      if(state.cloud.token) h['Authorization'] = 'Bearer ' + state.cloud.token;
      return h;
    }

    function setCloudUI(){
      cloudMode.value = state.cloud.mode;
      pollEvery.value = String(state.cloud.pollEvery || 0);
      ghToken.value = state.cloud.token || '';
      ghOwner.value = state.cloud.owner || '';
      ghRepo.value = state.cloud.repo || '';
      ghBranch.value = state.cloud.branch || 'main';
      ghPath.value = state.cloud.path || 'crate/onoi_notes/db/db.json';
      ghGistId.value = state.cloud.gistId || '';
      ghGistFile.value = state.cloud.gistFile || 'onoi_notes_db.json';

      repoFields.style.display = (state.cloud.mode === 'repo') ? '' : 'none';
      gistFields.style.display = (state.cloud.mode === 'gist') ? '' : 'none';
    }

    async function ghRepoGet(){
      const url = `https://api.github.com/repos/${encodeURIComponent(state.cloud.owner)}/${encodeURIComponent(state.cloud.repo)}/contents/${state.cloud.path}?ref=${encodeURIComponent(state.cloud.branch||'main')}`;
      const r = await fetch(url, { headers: cloudHeaders() });
      if(r.status === 404){
        return { exists:false, sha:null, json:null };
      }
      if(!r.ok){
        const t = await r.text();
        throw new Error('Repo GET failed: ' + r.status + ' ' + t.slice(0,200));
      }
      const data = await r.json();
      const content = (data && data.content) ? atob(data.content.replace(/\n/g,'')) : '';
      const json = content ? JSON.parse(content) : null;
      return { exists:true, sha:data.sha || null, json };
    }

    async function ghRepoPut(obj, sha){
      const url = `https://api.github.com/repos/${encodeURIComponent(state.cloud.owner)}/${encodeURIComponent(state.cloud.repo)}/contents/${state.cloud.path}`;
      const body = {
        message: 'onoi_notes autosync',
        content: btoa(unescape(encodeURIComponent(JSON.stringify(obj)))),
        branch: state.cloud.branch || 'main'
      };
      if(sha) body.sha = sha;
      const r = await fetch(url, { method:'PUT', headers: { ...cloudHeaders(), 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      const t = await r.text();
      if(!r.ok){
        throw new Error('Repo PUT failed: ' + r.status + ' ' + t.slice(0,200));
      }
      const data = JSON.parse(t);
      return { sha: data.content && data.content.sha ? data.content.sha : null };
    }

    async function ghGistGet(){
      const url = `https://api.github.com/gists/${encodeURIComponent(state.cloud.gistId)}`;
      const r = await fetch(url, { headers: cloudHeaders() });
      if(!r.ok){
        const t = await r.text();
        throw new Error('Gist GET failed: ' + r.status + ' ' + t.slice(0,200));
      }
      const data = await r.json();
      const files = data.files || {};
      const file = files[state.cloud.gistFile] || Object.values(files)[0];
      if(!file) return { json:null };
      const content = file.content || '';
      const json = content ? JSON.parse(content) : null;
      return { json };
    }

    async function ghGistPatch(obj){
      const url = `https://api.github.com/gists/${encodeURIComponent(state.cloud.gistId)}`;
      const body = {
        files: {
          [state.cloud.gistFile]: { content: JSON.stringify(obj, null, 2) }
        }
      };
      const r = await fetch(url, { method:'PATCH', headers:{ ...cloudHeaders(), 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      const t = await r.text();
      if(!r.ok){
        throw new Error('Gist PATCH failed: ' + r.status + ' ' + t.slice(0,200));
      }
      return true;
    }

    function mergeSnapshots(localSnap, remoteSnap){
      // Merge by ids and updatedAt (last-write-wins per entity).
      const out = currentDBSnapshot();
      const mapCats = new Map();
      const mapNotes = new Map();

      function upsertCat(c){
        const cur = mapCats.get(c.id);
        if(!cur || (Number(c.updatedAt||0) > Number(cur.updatedAt||0))) mapCats.set(c.id, c);
      }
      function upsertNote(n){
        const cur = mapNotes.get(n.id);
        if(!cur || (Number(n.updatedAt||0) > Number(cur.updatedAt||0))) mapNotes.set(n.id, n);
      }

      (localSnap?.cats || []).forEach(upsertCat);
      (remoteSnap?.cats || []).forEach(upsertCat);
      (localSnap?.notes || []).forEach(upsertNote);
      (remoteSnap?.notes || []).forEach(upsertNote);

      out.cats = [...mapCats.values()];
      out.notes = [...mapNotes.values()];

      // basic orphan fix
      const catIds = new Set(out.cats.map(c => c.id));
      const fallbackCat = out.cats[0]?.id || null;
      out.notes = out.notes.map(n => catIds.has(n.catId) ? n : ({...n, catId: fallbackCat}));

      return out;
    }

    let cloudPushTimer = null;
    function scheduleCloudPush(){
      if(state.cloud.mode === 'off') return;
      if(cloudPushTimer) clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(async () => {
        try{
          setSync('warn', 'syncing');
          const snap = currentDBSnapshot();

          if(state.cloud.mode === 'repo'){
            const cur = await ghRepoGet();
            const merged = cur.json ? mergeSnapshots(snap, cur.json) : snap;
            const res = await ghRepoPut(merged, cur.sha);
            state.cloud.lastSha = res.sha;
          } else if(state.cloud.mode === 'gist'){
            let remote = null;
            try{ remote = (await ghGistGet()).json; }catch(e){ remote = null; }
            const merged = remote ? mergeSnapshots(snap, remote) : snap;
            await ghGistPatch(merged);
          }

          state.cloud.lastPushAt = now();
          saveCloudSettings();
          setSync('ok', 'cloud');
        }catch(e){
          setSync('bad', 'cloud err');
        }
      }, 1200);
    }

    async function cloudPull(){
      if(state.cloud.mode === 'off') return;
      setSync('warn', 'pulling');
      const local = currentDBSnapshot();
      if(state.cloud.mode === 'repo'){
        const cur = await ghRepoGet();
        const merged = cur.json ? mergeSnapshots(local, cur.json) : local;
        state.cloud.lastSha = cur.sha;
        await importJSON(merged);
      } else if(state.cloud.mode === 'gist'){
        const cur = await ghGistGet();
        const merged = cur.json ? mergeSnapshots(local, cur.json) : local;
        await importJSON(merged);
      }
      state.cloud.lastPullAt = now();
      saveCloudSettings();
      setSync('ok', 'cloud');
    }

    function startPolling(){
      if(state.cloud.pollTimer){
        clearInterval(state.cloud.pollTimer);
        state.cloud.pollTimer = null;
      }
      const sec = Number(state.cloud.pollEvery||0);
      if(state.cloud.mode === 'off' || !sec || sec <= 0) return;
      state.cloud.pollTimer = setInterval(async () => {
        try{
          await cloudPull();
        }catch(e){
          setSync('bad', 'cloud err');
        }
      }, sec * 1000);
    }

        try{
          await cloudPull();
        }catch(e){
          setSync('bad','cloud err');
        }
      }
    }

    boot();
  })();

(function(){
  'use strict';

  const HL_RECENT_KEY = 'onoi_notes_recent_marker_colors_v1';
  const SIDEBAR_KEY = 'onoi_notes_sidebar_collapsed_v1';

  // -------------------------
  // Utilities: selection markers (comments) to keep selection stable
  // -------------------------
  function inEditorSelection(){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount === 0) return null;
    const r = sel.getRangeAt(0);
    if(!editor.contains(r.commonAncestorContainer)) return null;
    return r;
  }
  function focusEditorSafe(){
    try{ editor.focus({preventScroll:true}); }catch(e){ try{ editor.focus(); }catch(_e){} }
  }

  function insertMarkersFromRange(range){
    const doc = range.startContainer.ownerDocument;
    const start = doc.createComment('onoi_sel_start');
    const end = doc.createComment('onoi_sel_end');
    // insert end first (so start offsets remain valid)
    const endRange = range.cloneRange();
    endRange.collapse(false);
    endRange.insertNode(end);
    const startRange = range.cloneRange();
    startRange.collapse(true);
    startRange.insertNode(start);
    return {start, end};
  }

  function restoreRangeFromMarkers(markers){
    const {start, end} = markers || {};
    if(!start || !end || !start.parentNode || !end.parentNode) return null;
    const r = document.createRange();
    r.setStartAfter(start);
    r.setEndBefore(end);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
    // clean markers
    start.remove();
    end.remove();
    return r;

  // -------------------------
  // Merge adjacent spans with same inline style (for color/back-color)
  // -------------------------
  function normalizeSpans(){
    // merge adjacent spans that only differ by being separate nodes
    const walker = document.createTreeWalker(editor, NodeFilter.SHOW_ELEMENT, {
      acceptNode(node){
        if(node.nodeName === 'SPAN' && node.hasAttribute('style')) return NodeFilter.FILTER_ACCEPT;
        return NodeFilter.FILTER_SKIP;
      }
    });
    const spans = [];
    while(walker.nextNode()) spans.push(walker.currentNode);

    for(const sp of spans){
      if(!sp.parentNode) continue;
      // remove empty / zwsp-only
      if(sp.textContent === '\u200B') { sp.remove(); continue; }
      // unwrap style-less
      if(!sp.getAttribute('style')) { unwrap(sp); continue; }
    }

    // helper: stable style compare (order-insensitive)
    function normStyleText(el){
      const css = (el.getAttribute('style')||'').trim();
      if(!css) return '';
      return css.split(';').map(x => x.trim().toLowerCase()).filter(Boolean).sort().join(';');
    }

    // merge pass (adjacent siblings)
    const mergeCandidates = editor.querySelectorAll('span[style]');
    for(const sp of mergeCandidates){
      if(!sp.parentNode) continue;
      const next = sp.nextSibling;
      if(next && next.nodeType === 1 && next.nodeName === 'SPAN'){
        const a = normStyleText(sp);
        const b = normStyleText(next);
        if(a && a === b){
          while(next.firstChild) sp.appendChild(next.firstChild);
          next.remove();
        }
      }
    }

  }
  function unwrap(el){
    const p = el.parentNode;
    if(!p) return;
    while(el.firstChild) p.insertBefore(el.firstChild, el);
    el.remove();
  }

    window.__onoi_sanitize_wrapped = true;
    const _sanitize = window.sanitizeEditorHTML;
    window.sanitizeEditorHTML = function(){
      try{ _sanitize(); }catch(e){}
      try{
        // remove leftover selection/caret artifacts
        editor.querySelectorAll('span[data-onoi-caret="1"]').forEach(sp => {
          if(sp.textContent === '\u200B' || sp.textContent === '') sp.remove();
          else sp.removeAttribute('data-onoi-caret');
        });
        // normalize pre>code to plain text (no spans inside)
        editor.querySelectorAll('pre').forEach(pre => {
          let code = pre.querySelector('code');
          if(!code){
            code = document.createElement('code');
            // keep pre text
            code.textContent = pre.textContent;
            pre.textContent = '';
            pre.appendChild(code);
          }
          // collapse any markup inside code
          code.textContent = code.textContent;
        });

        normalizeSpans();
      }catch(e){}
    };
  }

  // -------------------------
  // Snapshot history (HTML + selection paths)
  // -------------------------
  const hist = {
    noteId: null,
    stack: [],
    idx: -1,
    pending: null
  };

  function nodeToPath(node){
    const path = [];
    let cur = node;
    while(cur && cur !== editor){
      const parent = cur.parentNode;
      if(!parent) break;
      const children = Array.from(parent.childNodes);
      path.push(children.indexOf(cur));
      cur = parent;
    }
    return path.reverse();
  }
  function pathToNode(path){
    let cur = editor;
    for(const idx of path){
      if(!cur || !cur.childNodes || idx < 0 || idx >= cur.childNodes.length) return null;
      cur = cur.childNodes[idx];
    }
    return cur;
  }

  function serializeSelection(){
    const r = inEditorSelection();
    if(!r) return null;
    return {
      sc: nodeToPath(r.startContainer),
      so: r.startOffset,
      ec: nodeToPath(r.endContainer),
      eo: r.endOffset
    };
  }
  function restoreSelectionFromSerialized(selObj){
    if(!selObj) return;
    const sc = pathToNode(selObj.sc);
    const ec = pathToNode(selObj.ec);
    if(!sc || !ec) return;
    const r = document.createRange();
    try{
      r.setStart(sc, Math.min(selObj.so, sc.nodeType===3 ? sc.nodeValue.length : sc.childNodes.length));
      r.setEnd(ec, Math.min(selObj.eo, ec.nodeType===3 ? ec.nodeValue.length : ec.childNodes.length));
    }catch(e){ return; }
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  function histReset(noteId){
    hist.noteId = noteId || (editor.dataset.noteId || null);
    hist.stack = [{ html: editor.innerHTML, sel: serializeSelection() }];
    hist.idx = 0;
  }
  function histCommitNow(reason){
    const noteId = editor.dataset.noteId || null;
    if(hist.noteId !== noteId) histReset(noteId);
    const snap = { html: editor.innerHTML, sel: serializeSelection(), t: Date.now(), reason: reason || '' };
    const prev = hist.stack[hist.idx];
    if(prev && prev.html === snap.html) return;
    hist.stack = hist.stack.slice(0, hist.idx+1);
    hist.stack.push(snap);
    hist.idx = hist.stack.length-1;
  }
  function histCommitSoon(reason){
    clearTimeout(hist.pending);
    hist.pending = setTimeout(() => histCommitNow(reason || 'input'), 420);
  }
  function histUndo(){
    if(hist.idx <= 0) return;
    hist.idx -= 1;
    const snap = hist.stack[hist.idx];
    editor.innerHTML = snap.html;
    try{ window.sanitizeEditorHTML(); }catch(e){}
    restoreSelectionFromSerialized(snap.sel);
    try{ window.schedulePersist && window.schedulePersist(); }catch(e){}
  }
  function histRedo(){
    if(hist.idx >= hist.stack.length-1) return;
    hist.idx += 1;
    const snap = hist.stack[hist.idx];
    editor.innerHTML = snap.html;
    try{ window.sanitizeEditorHTML(); }catch(e){}
    restoreSelectionFromSerialized(snap.sel);
    try{ window.schedulePersist && window.schedulePersist(); }catch(e){}
  }

    const nr = document.createRange();
    nr.setStart(tn, tn.nodeValue.length);
    nr.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(nr);
  }

  editor.addEventListener('paste', (ev) => {
    const info = getCodeAtSelection();
    if(!info) return; // normal paste handler in existing code handles plain text
    ev.preventDefault();
    const text = (ev.clipboardData && ev.clipboardData.getData('text/plain')) || '';
    insertTextAtRange(info.range, text.replace(/\r\n/g, '\n'));
    try{ window.sanitizeEditorHTML(); }catch(e){}
    histCommitSoon('paste-code');
    try{ window.schedulePersist && window.schedulePersist(); }catch(e){}
  });

  editor.addEventListener('keydown', (ev) => {
    const info = getCodeAtSelection();
    if(!info) {
      // shortcuts outside code
      if((ev.ctrlKey || ev.metaKey) && !ev.altKey){
        const k = ev.key.toLowerCase();
        if(k === 'z'){
          ev.preventDefault();
          if(ev.shiftKey) histRedo(); else histUndo();
          return;
        }
        if(k === 'y'){
          ev.preventDefault(); histRedo(); return;
        }
        if(k === 'b' || k === 'i' || k === 'u'){
          // let execCommand handle (existing listeners)
          return;
        }
        if(ev.shiftKey && k === 'q'){
          ev.preventDefault(); toggleQuote(); return;
        }
        if(k === '`'){
          ev.preventDefault(); toggleCodeBlock(); return;
        }
      }
      if(ev.key === 'Escape'){
        if(hlPop && !hlPop.hidden){ ev.preventDefault(); closeHlPop(); return; }
        if(!textColorPop.hidden){ ev.preventDefault(); closeColorPop(); return; }
        if(document.body.classList.contains('drawer-open')){ ev.preventDefault(); closeDrawer(); return; }
        if(document.body.classList.contains('focus-mode')){ ev.preventDefault(); setFocus(false); return; }
      }
      return;
    }

    // inside code
    if(ev.key === 'Tab'){
      ev.preventDefault();
      const tabStr = '  ';
      if(ev.shiftKey){
        // outdent at caret: remove preceding 2 spaces if present
        const r = info.range;
        const sc = r.startContainer;
        if(sc.nodeType === 3){
          const off = r.startOffset;
          const val = sc.nodeValue;
          if(off >= 2 && val.slice(off-2, off) === tabStr){
            sc.nodeValue = val.slice(0, off-2) + val.slice(off);
            const nr = document.createRange();
            nr.setStart(sc, off-2);
            nr.collapse(true);
            const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(nr);
          }
        }
      } else {
        insertTextAtRange(info.range, tabStr);
      }
      histCommitSoon('tab-code');
      return;
    }

    if(ev.key === 'Enter'){
      ev.preventDefault();
      insertTextAtRange(info.range, '\n');
      histCommitSoon('enter-code');
      return;
    }

    if((ev.ctrlKey || ev.metaKey) && !ev.altKey){
      const k = ev.key.toLowerCase();
      if(k === 'z'){ ev.preventDefault(); if(ev.shiftKey) histRedo(); else histUndo(); return; }
      if(k === 'y'){ ev.preventDefault(); histRedo(); return; }
    }
  });

  // -------------------------
  // Floating Copy button for code blocks
  // -------------------------
  let lastPreForCopy = null;
  function updateCodeCopyButton(){
    if(!codeCopyBtn) return;
    const info = getCodeAtSelection();
    if(!info){ codeCopyBtn.hidden = true; lastPreForCopy = null; return; }
    lastPreForCopy = info.pre;
    const r = info.pre.getBoundingClientRect();
    codeCopyBtn.hidden = false;
    codeCopyBtn.style.left = (Math.min(window.innerWidth - 80, r.right - 70)) + 'px';
    codeCopyBtn.style.top = (Math.max(8, r.top + 8)) + 'px';
  }
  if(codeCopyBtn){
    codeCopyBtn.addEventListener('click', async () => {
      if(!lastPreForCopy) return;
      const code = lastPreForCopy.querySelector('code') || lastPreForCopy;
      const text = (code.textContent || '');
      try{
        await navigator.clipboard.writeText(text);
      }catch(e){
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try{ document.execCommand('copy'); }catch(_e){}
        ta.remove();
      }
      codeCopyBtn.textContent = 'Copied';
      setTimeout(() => { codeCopyBtn.textContent = 'Copy'; }, 700);
    });
    window.addEventListener('scroll', updateCodeCopyButton, {passive:true});
    window.addEventListener('resize', updateCodeCopyButton, {passive:true});
  }

  // -------------------------
  // Undo / Redo buttons
  // -------------------------
  if(undoBtn) undoBtn.addEventListener('click', () => { focusEditorSafe(); histUndo(); });
  if(redoBtn) redoBtn.addEventListener('click', () => { focusEditorSafe(); histRedo(); });

  // -------------------------
  // Sidebar (desktop collapse) vs Drawer (mobile)
  // -------------------------
  function isMobile(){
    return window.matchMedia('(max-width: 900px)').matches;
  }
  function setSidebarCollapsedDesktop(collapsed){
    document.body.classList.toggle('is-sidebar-collapsed', !!collapsed);
    try{ localStorage.setItem(SIDEBAR_KEY, collapsed ? '1':'0'); }catch(e){}
  }
  function openDrawer(){
    document.body.classList.add('drawer-open');
  }
  function closeDrawer(){
    document.body.classList.remove('drawer-open');
  }

  // init desktop sidebar state
  try{
    const v = localStorage.getItem(SIDEBAR_KEY);
    if(v === '1' && !isMobile()) setSidebarCollapsedDesktop(true);
  }catch(e){}

  if(toggleSidebarBtn){
    toggleSidebarBtn.addEventListener('click', () => {
      if(isMobile()){
        openDrawer();
      } else {
        const next = !document.body.classList.contains('is-sidebar-collapsed');
        setSidebarCollapsedDesktop(next);
      }
    });
  }
  if(openDrawerBtn) openDrawerBtn.addEventListener('click', openDrawer);
  if(closeDrawerBtn) closeDrawerBtn.addEventListener('click', closeDrawer);
  if(drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);

  // if switching between mobile/desktop, clear conflicting states
  window.addEventListener('resize', () => {
    if(isMobile()){
      // don't hide sidebar permanently on mobile
      document.body.classList.remove('is-sidebar-collapsed');
    } else {
      closeDrawer();
      // restore desktop preference
      try{
        const v = localStorage.getItem(SIDEBAR_KEY);
        if(v === '1') document.body.classList.add('is-sidebar-collapsed');
      }catch(e){}
    }
  }, {passive:true});

  // -------------------------
  // Focus mode
  // -------------------------
  function setFocus(on){
    document.body.classList.toggle('focus-mode', !!on);
    try{ localStorage.setItem(FOCUS_KEY, on ? '1':'0'); }catch(e){}
    if(focusBtn){
      focusBtn.textContent = on ? 'exit focus' : 'focus';
      focusBtn.classList.toggle('is-primary', !!on);
    }
    if(on) closeDrawer();
  }
  if(focusBtn){
    focusBtn.addEventListener('click', () => setFocus(!document.body.classList.contains('focus-mode')));
  }
  try{
    const v = localStorage.getItem(FOCUS_KEY);
    if(v === '1') setFocus(true);
  }catch(e){}

  // Global ESC handling
  document.addEventListener('keydown', (ev) => {
    if(ev.key !== 'Escape') return;
    if(hlPop && !hlPop.hidden){ ev.preventDefault(); closeHlPop(); return; }
    if(!textColorPop.hidden){ ev.preventDefault(); closeColorPop(); return; }
    if(document.body.classList.contains('drawer-open')){ ev.preventDefault(); closeDrawer(); return; }
    if(document.body.classList.contains('focus-mode')){ ev.preventDefault(); setFocus(false); return; }
  });

})();
</script>
