<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting...</title>
  <script>
    (function(){
      var hash = String(window.location.hash || "");
      var params = new URLSearchParams(String(window.location.search || "").replace(/^\?/, ""));
      if (!params.has("legacy")) params.set("legacy", "1");
      var query = params.toString();
      var target = "./student_helper.html" + (query ? "?" + query : "?legacy=1") + hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="./student_helper.html?legacy=1">Student Helper</a>...</p>
</body>
</html>
