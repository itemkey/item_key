<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>item - manufacture</title>

  <style>
    :root{
      --bg:#fff;
      --fg:#000;
      --line:#000;
      --muted:rgba(0,0,0,.70);
      --muted2:rgba(0,0,0,.52);
      --top:56px;
      --bot:56px;
      --shadow:0 0 0 6px rgba(0,0,0,.06);
      --shadow2: 0 0 0 10px rgba(0,0,0,.035);
    }

    html, body { background:var(--bg) !important; background-image:none !important; color:var(--fg); }
    body::before, body::after, html::before, html::after{ content:none !important; display:none !important; }
    *{ box-sizing:border-box; }
    a{ color:inherit; text-decoration:none; }
    button{ font:inherit; color:inherit; background:none; border:none; padding:0; }
    ::selection{ background:#000; color:#fff; }

    body{
      margin:0;
      overflow-x:hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing:.01em;
    }

    .goth{
      font-family: ui-serif, "Times New Roman", Georgia, serif;
      letter-spacing:.09em;
      text-transform:uppercase;
      font-weight:900;
    }

    .veil{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:2;
      border:2px solid var(--line);
      mix-blend-mode:multiply;
    }
    .veil::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        linear-gradient(90deg, rgba(0,0,0,.12), rgba(0,0,0,0)),
        repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, rgba(0,0,0,0) 1px 6px);
      opacity:.22;
      mix-blend-mode:multiply;
    }

    .topbar{
      position:fixed;
      top:0; left:0; right:0;
      height:var(--top);
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      background:rgba(255,255,255,.92);
      backdrop-filter: blur(2px);
      border-bottom:2px solid var(--line);
      gap:10px;
    }

    .leftgroup{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      flex: 1 1 auto;
    }
    .sentinel{ height:1px; width:1px; }
    .brand{
      display:flex;
      align-items:baseline;
      gap:10px;
      padding:8px 10px;
      border:2px solid var(--line);
      border-radius:0;
      box-shadow: var(--shadow);
      background:#fff;
      user-select:none;
      white-space:nowrap;
    }
    .brand .sig{ font-size:12px; opacity:.90; }
    .brand .sub{
      font-size:11px;
      opacity:.62;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-weight:900;
    }

    .nav{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .navbtn{
      appearance:none;
      cursor:pointer;
      border:2px solid var(--line);
      background:#fff;
      padding:9px 12px;
      border-radius:0;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:900;
      font-size:12px;
      position:relative;
      transform:translateZ(0);
      user-select:none;
    }
    .navbtn:hover{ transform: translateY(-1px); }
    .navbtn:active{ transform: translateY(0px); }
    .navbtn[aria-current="true"]{ background:#000; color:#fff; }

    /* bottom (no hints) */
    .bottombar{
      position:fixed;
      left:0; right:0; bottom:0;
      height:var(--bot);
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      padding:10px 12px;
      background:rgba(255,255,255,.92);
      backdrop-filter: blur(2px);
      border-top:2px solid var(--line);
      gap:10px;
    }
    .status{
      font-size:11px;
      opacity:.78;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 92vw;
    }

    .stage{
      position:relative;
      z-index:3;
      padding-top:var(--top);
      padding-bottom:var(--bot);
      min-height:100vh;
    }
    .view{ display:none; }
    .view.is-active{ display:block; }

    /* FACE gallery */
    .slides{
      scroll-snap-type:y proximity;
      height: calc(100vh - var(--top) - var(--bot));
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      outline:none;
    }
    .slides::-webkit-scrollbar{ width:10px; }
    .slides::-webkit-scrollbar-track{ background:#fff; }
    .slides::-webkit-scrollbar-thumb{ background:#000; border:2px solid #fff; border-radius:0; }

    .slide{
      position:relative;
      height: calc(100vh - var(--top) - var(--bot));
      width:100%;
      scroll-snap-align:start;
      border-top:2px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:#fff;
    }
    .slide:first-child{ border-top:0; }
    
    .slide-ritual{
      height:auto;
      align-items:stretch;
      justify-content:stretch;
      overflow:visible;
      padding:0;
      background:#fff;
    }
    .slide-ritual .ritual{
      border-top:0;
      min-height: calc(100vh - var(--top) - var(--bot));
    }

.slide img{
      width:100%;
      height:100%;
      object-fit:cover;
      transform: scale(1.01);
      user-select:none;
    }
    .slide::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.00), rgba(255,255,255,.00) 60%, rgba(255,255,255,.10)),
        repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, rgba(0,0,0,0) 1px 7px);
      mix-blend-mode:multiply;
      opacity:.18;
    }
    .badge{
      position:absolute;
      left:14px;
      bottom:14px;
      padding:10px 12px;
      border:2px solid var(--line);
      background:#fff;
      border-radius:0;
      box-shadow: var(--shadow);
      max-width: min(620px, calc(100% - 28px));
    }
    .badge .t{ font-size:12px; margin:0 0 6px; opacity:.9; }
    .badge .m{
      font-size:11px; margin:0;
      opacity:.65;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .blade{
      position:absolute;
      top:12px;
      left:12px;
      z-index:4;
      border:2px solid var(--line);
      background:#fff;
      border-radius:0;
      box-shadow: var(--shadow);
      padding:10px 12px;
      display:flex;
      gap:10px;
      align-items:baseline;
      max-width:min(720px, calc(100% - 24px));
      user-select:none;
    }
    .blade .name{ font-size:12px; margin:0; }

    /* SHAP-TERS - ritual list */
    .ritual{
      min-height: calc(100vh - var(--top) - var(--bot));
      padding: 18px 14px 22px;
      border-top:2px solid var(--line);
      background:#fff;
      position:relative;
      overflow:hidden;
    }
    .ritual::before{
      content:"";
      position:absolute;
      inset:-2px;
      pointer-events:none;
      background:
        radial-gradient(1200px 700px at 20% 20%, rgba(0,0,0,.10), rgba(0,0,0,0) 60%),
        repeating-linear-gradient(135deg, rgba(0,0,0,.08) 0 1px, rgba(0,0,0,0) 1px 10px),
        repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, rgba(0,0,0,0) 1px 7px);
      opacity:.28;
      mix-blend-mode:multiply;
      filter: contrast(1.08);
    }
    .ritual-inner{ position:relative; max-width: 980px; margin:0 auto; }
    .ritual-title{
      margin: 10px 0 14px;
      padding: 14px 14px 12px;
      border:2px solid var(--line);
      box-shadow: var(--shadow2);
      background:#fff;
      position:relative;
      overflow:hidden;
    }
    .ritual-title::after{
      content:"";
      position:absolute;
      right:-40px; top:-40px;
      width:140px; height:140px;
      border:2px solid var(--line);
      transform: rotate(19deg);
      opacity:.18;
    }
    .ritual-title h1{ margin:0; font-size:14px; }
    .ritual-grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      margin-top:12px;
    }
    .sigil{
      border:2px solid var(--line);
      background:#fff;
      border-radius:0;
      box-shadow: var(--shadow2);
      padding:12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      position:relative;
      overflow:hidden;
      user-select:none;
    }
    .sigil::before{
      content:"";
      position:absolute;
      inset:-2px;
      pointer-events:none;
      background:
        linear-gradient(90deg, rgba(0,0,0,.12), rgba(0,0,0,0)),
        repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, rgba(0,0,0,0) 1px 8px);
      opacity:.16;
      mix-blend-mode:multiply;
    }
    .sigil:hover{ transform: translateY(-1px); }
    .sigil:active{ transform: translateY(0px); }
    .sigil .left{ position:relative; display:flex; flex-direction:column; gap:6px; }
    .sigil .name{ margin:0; font-size:13px; letter-spacing:.10em; }
    .sigil .meta{
      margin:0;
      font-size:11px;
      opacity:.70;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .sigil .tag{
      position:relative;
      border:2px solid var(--line);
      padding:6px 8px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
      background:#fff;
      opacity:.92;
      white-space:nowrap;
    }
    .sigil.is-locked{
      cursor:not-allowed;
      opacity:.70;
    }
    .sigil.is-locked .tag::after{
      content:"sealed";
      position:absolute;
      top:-9px;
      right:-10px;
      font-size:10px;
      padding:4px 6px;
      border:2px solid var(--line);
      background:#fff;
      transform: rotate(7deg);
    }

    /* EDWARD PAGE */
    .edward{
      min-height: calc(100vh - var(--top) - var(--bot));
      border-top:2px solid var(--line);
      background:#fff;
    }
    .hero{
      position:relative;
      height: calc(100vh - var(--top) - var(--bot));
      overflow:hidden;
      border-bottom:2px solid var(--line);
    }
    .hero img{
      width:100%;
      height:100%;
      object-fit:cover;
      transform: scale(1.015);
      user-select:none;
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.00), rgba(255,255,255,.00) 50%, rgba(255,255,255,.14)),
        repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, rgba(0,0,0,0) 1px 7px);
      mix-blend-mode:multiply;
      opacity:.20;
    }
    .hero-card{
      position:absolute;
      left:14px;
      bottom:14px;
      border:2px solid var(--line);
      background:#fff;
      border-radius:0;
      box-shadow: var(--shadow);
      padding:12px 12px;
      max-width:min(760px, calc(100% - 28px));
    }
    .hero-card h2{ margin:0; font-size:14px; }

    .catalog{
      padding: 18px 14px 26px;
      position:relative;
    }
    .catalog::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(135deg, rgba(0,0,0,.06) 0 1px, rgba(0,0,0,0) 1px 12px),
        radial-gradient(900px 500px at 70% 20%, rgba(0,0,0,.10), rgba(0,0,0,0) 55%);
      opacity:.22;
      mix-blend-mode:multiply;
    }
    .catalog-inner{ position:relative; max-width: 1040px; margin:0 auto; }
    .catalog-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    .catalog-head .title{
      border:2px solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding:12px 12px 10px;
      max-width: 820px;
    }
    .catalog-head .title h3{ margin:0; font-size:13px; }
    .catalog-head .back{
      border:2px solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding:10px 12px;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:900;
      font-size:12px;
      white-space:nowrap;
    }
    .catalog-head .back:hover{ transform: translateY(-1px); }
    .catalog-head .back:active{ transform: translateY(0px); }

    .products{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:10px;
    }

    /* PRODUCT CARD - gothic frame */
    .product{
      grid-column: span 12;
      border:2px solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      overflow:hidden;
      cursor:pointer;
      position:relative;
      user-select:none;

      /* sharp notches */
      clip-path: polygon(
        10px 0, calc(100% - 10px) 0,
        100% 10px, 100% calc(100% - 10px),
        calc(100% - 10px) 100%, 10px 100%,
        0 calc(100% - 10px), 0 10px
      );
      transform: translateZ(0);
    }

    /* inner frame + corner cuts */
    .product::before{
      content:"";
      position:absolute;
      inset:-2px;
      pointer-events:none;
      background:
        linear-gradient(90deg, rgba(0,0,0,.12), rgba(0,0,0,0)),
        repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, rgba(0,0,0,0) 1px 9px);
      opacity:.16;
      mix-blend-mode:multiply;
    }
    .product::after{
      content:"";
      position:absolute;
      inset:7px;
      pointer-events:none;
      border:2px solid rgba(0,0,0,.40);
      clip-path: polygon(
        9px 0, calc(100% - 9px) 0,
        100% 9px, 100% calc(100% - 9px),
        calc(100% - 9px) 100%, 9px 100%,
        0 calc(100% - 9px), 0 9px
      );
      opacity:.45;
    }

    .product:hover{ transform: translateY(-1px); }
    .product:active{ transform: translateY(0px); }

    .product .thumb{
      height: 240px;
      border-bottom:2px solid var(--line);
      overflow:hidden;
      background:#fff;
      position:relative;
    }
    .product .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      transform: scale(1.035);
      user-select:none;
      filter: contrast(1.03);
    }
    .thumb-veil{
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(800px 320px at 25% 20%, rgba(0,0,0,.12), rgba(0,0,0,0) 60%),
        linear-gradient(180deg, rgba(0,0,0,.00), rgba(0,0,0,.06)),
        repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, rgba(0,0,0,0) 1px 8px);
      opacity:.20;
      mix-blend-mode:multiply;
    }

    .runes{
      position:absolute;
      top:10px;
      left:10px;
      display:flex;
      gap:8px;
      align-items:center;
      pointer-events:none;
    }
    .rune{
      border:2px solid var(--line);
      background:#fff;
      padding:6px 8px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.10em;
      font-weight:900;
      box-shadow: var(--shadow2);
      clip-path: polygon(
        8px 0, calc(100% - 8px) 0,
        100% 8px, 100% calc(100% - 8px),
        calc(100% - 8px) 100%, 8px 100%,
        0 calc(100% - 8px), 0 8px
      );
    }
    .rune.dark{ background:#000; color:#fff; }

    .stamp{
      position:absolute;
      right:10px;
      bottom:10px;
      border:2px solid var(--line);
      background:#fff;
      box-shadow: var(--shadow);
      padding:8px 10px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.10em;
      font-weight:900;
      transform: rotate(-7deg);
      clip-path: polygon(
        9px 0, calc(100% - 9px) 0,
        100% 9px, 100% calc(100% - 9px),
        calc(100% - 9px) 100%, 9px 100%,
        0 calc(100% - 9px), 0 9px
      );
      opacity:.96;
      pointer-events:none;
    }
    .stamp.sold{ background:#000; color:#fff; }
    .stamp.sold::after{
      content:"sealed";
      margin-left:8px;
      opacity:.82;
    }

    .product .info{
      position:relative;
      padding:12px 12px 11px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      background:#fff;
    }
    .product .stack{ min-width: 0; }
    .product .info h4{
      margin:0 0 8px;
      font-size:13px;
      letter-spacing:.12em;
      line-height:1.2;
    }
    .product .info .meta{
      margin:0;
      font-size:11px;
      opacity:.74;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      line-height:1.5;
    }

    .card-actions{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      flex: 0 0 auto;
    }
    .seal{
      border:2px solid var(--line);
      padding:8px 10px;
      background:#fff;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-weight:900;
      box-shadow: var(--shadow2);
      clip-path: polygon(
        9px 0, calc(100% - 9px) 0,
        100% 9px, 100% calc(100% - 9px),
        calc(100% - 9px) 100%, 9px 100%,
        0 calc(100% - 9px), 0 9px
      );
    }
    .seal::before{
      content:"⟡";
      margin-right:8px;
      opacity:.90;
    }
    .dbmark{
      border:2px dashed rgba(0,0,0,.55);
      padding:6px 8px;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.10em;
      font-weight:900;
      opacity:.80;
      background:#fff;
      white-space:nowrap;
      max-width: 160px;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chip{
      border:2px solid var(--line);
      padding:6px 8px;
      background:#fff;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
      white-space:nowrap;
      opacity:.92;
      clip-path: polygon(
        8px 0, calc(100% - 8px) 0,
        100% 8px, 100% calc(100% - 8px),
        calc(100% - 8px) 100%, 8px 100%,
        0 calc(100% - 8px), 0 8px
      );
    }
    .chip.sold{ background:#000; color:#fff; }


    @media (min-width: 760px){
      .ritual-grid{ grid-template-columns: 1fr 1fr; }
      .product{ grid-column: span 6; }
      .product .thumb{ height: 260px; }
    }
    @media (min-width: 1060px){
      .product{ grid-column: span 4; }
      .product .thumb{ height: 270px; }
    }

    /* PRODUCT VIEW */
    .prodview{
      min-height: calc(100vh - var(--top) - var(--bot));
      border-top:2px solid var(--line);
      background:#fff;
      position:relative;
    }
    .prod-hero{
      padding:18px 14px 10px;
      border-bottom:2px solid var(--line);
      position:relative;
      overflow:hidden;
    }
    .prod-hero::before{
      content:"";
      position:absolute;
      inset:-2px;
      pointer-events:none;
      background:
        radial-gradient(900px 500px at 25% 15%, rgba(0,0,0,.10), rgba(0,0,0,0) 55%),
        repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, rgba(0,0,0,0) 1px 7px);
      opacity:.22;
      mix-blend-mode:multiply;
    }
    .prod-hero-inner{ position:relative; max-width:1040px; margin:0 auto; }
    .prod-hero-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .prod-hero-top .block{
      border:2px solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding:12px 12px 10px;
      max-width: 820px;
    }
    .prod-hero-top h2{ margin:0 0 10px; font-size:14px; }
    .prod-hero-top .meta{
      margin:0;
      font-size:11px;
      opacity:.74;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
      line-height:1.5;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .mini-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      border:2px solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding:10px 12px;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:900;
      font-size:12px;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn:active{ transform: translateY(0px); }
    .btn.primary{ background:#000; color:#fff; }

    .gallery{
      max-width:1040px;
      margin:0 auto;
      padding: 14px 14px 26px;
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:10px;
    }
    .shot{
      grid-column: span 12;
      border:2px solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      overflow:hidden;
      position:relative;
    }
    .shot img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      transform: scale(1.01);
      user-select:none;
    }
    @media (min-width: 860px){
      .shot{ grid-column: span 6; }
    }

    /* CART */
    .cart{
      min-height: calc(100vh - var(--top) - var(--bot));
      border-top:2px solid var(--line);
      background:#fff;
      padding:18px 14px 26px;
      position:relative;
    }
    .cart::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(135deg, rgba(0,0,0,.06) 0 1px, rgba(0,0,0,0) 1px 12px),
        radial-gradient(900px 500px at 35% 20%, rgba(0,0,0,.10), rgba(0,0,0,0) 55%);
      opacity:.22;
      mix-blend-mode:multiply;
    }
    .cart-inner{ position:relative; max-width: 980px; margin:0 auto; }
    .cart-box{
      border:2px solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding:14px 14px 12px;
    }
    .cart-box h2{ margin:0 0 10px; font-size:14px; }
    .cart-box .row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      padding:10px 0;
      border-top:2px dashed rgba(0,0,0,.35);
    }
    .cart-box .row:first-of-type{ border-top:none; padding-top:0; }
    .cart-box .nm{
      font-size:12px;
      letter-spacing:.10em;
      font-weight:900;
      text-transform:uppercase;
      margin:0 0 6px;
    }
    .cart-box .sm{
      margin:0;
      font-size:11px;
      opacity:.74;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
      line-height:1.5;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .cart-box .right{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .tiny{
      border:2px solid var(--line);
      padding:8px 10px;
      background:#fff;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
    }
    .tiny:hover{ transform: translateY(-1px); }
    .tiny:active{ transform: translateY(0px); }
    .tiny.danger{ background:#000; color:#fff; }
    .cart-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
      align-items:center;
      justify-content:space-between;
    }
    .total{
      border:2px solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding:10px 12px;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:900;
      white-space:nowrap;
    }

    @media (max-width: 720px){
      .brand .sub{ display:none; }
      .badge{ left:10px; bottom:10px; }
      .blade{ left:10px; top:10px; }
      .nav{ gap:8px; }
      .navbtn{ padding:9px 10px; }
    }
    @media (prefers-reduced-motion: reduce){
      .navbtn:hover, .sigil:hover, .btn:hover, .product:hover, .tiny:hover{ transform:none; }
      .slide img, .hero img, .product .thumb img, .shot img{ transform:none; }
    }
  </style>
</head>

<body>
  <div class="veil" aria-hidden="true"></div>

  <header class="topbar" role="banner" aria-label="Панель управления">
    <div class="leftgroup">
      <a class="brand" id="brandHome" href="#face" aria-label="Вернуться к face" title="1">
        <span class="sig goth">item</span>
        <span class="sub">manufacture</span>
      </a>
    </div>

    <nav class="nav" aria-label="Категории">
      <button class="navbtn" id="btnFace" type="button" aria-current="true" title="1" aria-keyshortcuts="1">face</button>
      <button class="navbtn" id="btnShapters" type="button" aria-current="false" title="2" aria-keyshortcuts="2">shap-ters</button>
      <button class="navbtn" id="btnCart" type="button" aria-current="false" title="3" aria-keyshortcuts="3">cart</button>
    </nav>
  </header>

  <main class="stage" aria-label="Контент">

    <!-- VIEW: FACE -->
    <section class="view is-active" id="view-face" aria-label="Категория face">
      <div class="blade" aria-hidden="true">
        <p class="name goth">face</p>
      </div>

      <div class="slides" id="faceSlides" tabindex="0" aria-label="Галерея face">
      <div class="sentinel" id="sentinelFaceTop" aria-hidden="true"></div>
      <!-- FACE slides are injected here by JS -->

      <!-- SLIDE: SHAP-TERS (embedded after FACE) -->
      <section class="slide slide-ritual" id="slide-shapters" data-kind="shapters" aria-label="Категория shap-ters">
<div class="ritual">
        <div class="ritual-inner">
          <div class="ritual-title">
            <h1 class="goth">The Shapeshifters of the Ritual</h1>
          </div>

          <div class="ritual-grid" role="list" aria-label="Список сущностей">
            <button class="sigil goth is-locked" type="button" aria-disabled="true" title="sealed" role="listitem">
              <span class="left">
                <span class="name">unregistered</span>
                <span class="meta"><span>status: unknown</span><span>access: denied</span></span>
              </span>
              <span class="tag">sealed</span>
            </button>

            <button class="sigil goth" type="button" id="goEdward" role="listitem">
              <span class="left">
                <span class="name">Edward Phillips</span>
                <span class="meta"><span>status: active</span><span>catalog: 03</span></span>
              </span>
              <span class="tag">enter</span>
            </button>

            <button class="sigil goth is-locked" type="button" aria-disabled="true" title="sealed" role="listitem">
              <span class="left">
                <span class="name">Martyn Riot</span>
                <span class="meta"><span>status: sealed</span><span>access: denied</span></span>
              </span>
              <span class="tag">sealed</span>
            </button>

            <button class="sigil goth is-locked" type="button" aria-disabled="true" title="sealed" role="listitem">
              <span class="left">
                <span class="name">Step Macros</span>
                <span class="meta"><span>status: sealed</span><span>access: denied</span></span>
              </span>
              <span class="tag">sealed</span>
            </button>
          </div>
        </div>
      </div>
      </section>

      </div>
    </section>

    <!-- VIEW: EDWARD -->
    <section class="view" id="view-edward" aria-label="Edward Phillips">
      <div class="edward">
        <section class="hero" aria-label="Презентация мутанта">
          <img src="assets/img/face/face_edph.jpg" alt="face_edph" />
          <div class="hero-card">
            <h2 class="goth">Edward Phillips</h2>
          </div>
        </section>

        <section class="catalog" aria-label="Каталог одежды">
          <div class="catalog-inner">
            <div class="catalog-head">
              <div class="title">
                <h3 class="goth">Wardrobe Catalog</h3>
              </div>
              <button class="back goth" type="button" id="backToShapters">ritual</button>
            </div>

            <div class="products" id="edwardProducts" aria-label="Список товаров"></div>
          </div>
        </section>
      </div>
    </section>

    <!-- VIEW: PRODUCT -->
    <section class="view" id="view-product" aria-label="Просмотр товара">
      <div class="prodview">
        <div class="prod-hero">
          <div class="prod-hero-inner">
            <div class="prod-hero-top">
              <div class="block">
                <h2 class="goth" id="prodTitle">product</h2>
                <p class="meta" id="prodMeta"></p>
              </div>

              <div class="mini-actions">
                <button class="btn goth" type="button" id="prodBack">back</button>
                <button class="btn primary goth" type="button" id="prodToCart">to cart</button>
              </div>
            </div>
          </div>
        </div>

        <div class="gallery" id="prodGallery" aria-label="Галерея товара"></div>
      </div>
    </section>

    <!-- VIEW: CART -->
    <section class="view" id="view-cart" aria-label="Корзина">
      <div class="cart">
        <div class="cart-inner">
          <div class="cart-box">
            <h2 class="goth">Cart</h2>

            <div id="cartList"></div>

            <div class="cart-actions">
              <div class="mini-actions">
                <button class="btn goth" type="button" id="cartBack">back</button>
                <button class="btn goth" type="button" id="cartClear">clear</button>
              </div>

              <div class="mini-actions">
                <div class="total goth" id="cartTotal">$0.00</div>
                <a class="btn primary goth" id="purchaseBtn" href="https://t.me/item_mngr" target="_blank" rel="noopener">purchase</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="bottombar" role="contentinfo" aria-label="Статус">
    <span class="status" id="statusLeft">face: loading</span>
  </footer>

  <script>
    (function(){
      const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // NOTE: currency conversion (fixed, can be changed here)
      const BYN_TO_USD = 0.30;

      // Prices pulled from your item-manufacture.db.json (embedded here, no fetch)
      const DB_PRICES = [
        { id:"2ad73f2de9467819b4f95447f", name:"ITEM: void-stitch", priceBYN:150, inStock:true },
        { id:"9efbee6ffc2dc819b4f948612", name:"ITEM: Celestial_Assistant", priceBYN:100, inStock:false },
        { id:"8d6587d2a18619b4f9391c8",  name:"ITEM: Cartel Hatchling", priceBYN:250, inStock:false }
      ];

      function moneyUSD(x){
        const v = Math.round((Number(x) || 0) * 100) / 100;
        return "$" + v.toFixed(2);
      }

      function findPriceByName(title){
        const t = String(title || "").toLowerCase();
        const hit = DB_PRICES.find(p => t.includes(p.name.toLowerCase().replace("item: ","").replace("item:","").trim()));
        return hit || null;
      }

      // Views
      const views = {
        face: document.getElementById("view-face"),
        edward: document.getElementById("view-edward"),
        product: document.getElementById("view-product"),
        cart: document.getElementById("view-cart"),
      };

      // Header controls
      const brandHome = document.getElementById("brandHome");
      const btnBack = document.getElementById("btnBack");

      // Nav buttons
      const btnFace = document.getElementById("btnFace");
      const btnSh = document.getElementById("btnShapters");
      const btnCart = document.getElementById("btnCart");

      const statusLeft = document.getElementById("statusLeft");

      // Face
      const faceSlides = document.getElementById("faceSlides");

      // Shap-ters actions
      const goEdward = document.getElementById("goEdward");

      // Edward products
      const edwardProducts = document.getElementById("edwardProducts");
      const backToShapters = document.getElementById("backToShapters");

      // Product view
      const prodTitle = document.getElementById("prodTitle");
      const prodMeta = document.getElementById("prodMeta");
      const prodGallery = document.getElementById("prodGallery");
      const prodBack = document.getElementById("prodBack");
      const prodToCart = document.getElementById("prodToCart");

      // Cart view
      const cartList = document.getElementById("cartList");
      const cartBack = document.getElementById("cartBack");
      const cartClear = document.getElementById("cartClear");
      const cartTotal = document.getElementById("cartTotal");

      // Data
      const DB = {
        owner: "Edward Phillips",
        products: [
          {
            id: "celestial-assistant",
            title: "Celestial Assistant",
            images: [
              "assets/img/images_db/Edward_Phillips/Celestial_Assistant01.png",
              "assets/img/images_db/Edward_Phillips/Celestial_Assistant02.png"
            ]
          },
          {
            id: "void-stitch",
            title: "void stitch",
            images: [
              "assets/img/images_db/Edward_Phillips/void-stitch01.png",
              "assets/img/images_db/Edward_Phillips/void-stitch02.png"
            ]
          },
          {
            id: "cartel-hatchling",
            title: "Cartel Hatchling",
            images: [
              "assets/img/images_db/Edward_Phillips/CartelHatchling01.png",
              "assets/img/images_db/Edward_Phillips/CartelHatchling02.png",
              "assets/img/images_db/Edward_Phillips/CartelHatchling03.png"
            ]
          }
        ]
      };

      // Attach prices (from embedded DB_PRICES) to our products
      DB.products.forEach(p=>{
        const hit = findPriceByName(p.title);
        const byn = hit ? hit.priceBYN : 0;
        p.priceBYN = byn;
        p.priceUSD = (byn * BYN_TO_USD);
        p.inStock = hit ? !!hit.inStock : true;
        p.dbId = hit ? hit.id : "";
      });

      // Cart state
      const CART_KEY = "item_cart_v2";
      function readCart(){
        try{
          const raw = localStorage.getItem(CART_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr : [];
        }catch(_){ return []; }
      }
      function writeCart(arr){
        try{ localStorage.setItem(CART_KEY, JSON.stringify(arr)); }catch(_){}
      }
      function addToCart(item){
        const cart = readCart();
        if(!cart.find(x => x.id === item.id)){
          cart.push({
            id:item.id,
            title:item.title,
            owner:DB.owner,
            priceUSD: Math.round((Number(item.priceUSD)||0)*100)/100,
            inStock: !!item.inStock
          });
          writeCart(cart);
        }
      }
      function removeFromCart(id){
        const cart = readCart().filter(x => x.id !== id);
        writeCart(cart);
      }
      function clearCart(){ writeCart([]); }

      // Navigation helpers (fast in/out everywhere)
      let trail = [];
      let lastNonCart = "#face";
      let faceCount = 0;

      function normHash(h){
        const s = String(h || "").trim();
        if(!s) return "#face";
        return s.startsWith("#") ? s : ("#" + s);
      }

      function replaceHash(hash){
        const target = normHash(hash);
        if(normHash(location.hash) === target) return;
        history.replaceState(null, "", target);
      }

      function scrollToFaceTop(){
        requestAnimationFrame(()=>{
          faceSlides.scrollTo({ top:0, behavior: prefersReduced ? "auto" : "smooth" });
        });
        setTimeout(() => faceSlides && faceSlides.focus({ preventScroll:true }), 60);
      }

      function scrollToEmbeddedShapters(){
        const node = document.getElementById("slide-shapters");
        if(!node) return;
        requestAnimationFrame(()=>{
          node.scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block:"start" });
        });
        setTimeout(() => faceSlides && faceSlides.focus({ preventScroll:true }), 60);
      }

      function navigateTo(hash){
        const target = normHash(hash);
        const cur = normHash(location.hash);

        // If user clicks the same tab again: jump to the section without changing hash
        if(cur === target){
          if(target === "#face"){ scrollToFaceTop(); }
          if(target === "#shap-ters" || target === "#shapters"){ scrollToEmbeddedShapters(); }
          return;
        }

        trail.push(cur);
        location.hash = target;
      }

      function goBack(){
        const prev = trail.pop();
        if(prev){
          location.hash = prev;
          return;
        }

        // Fallbacks when there's no trail
        if(views.product.classList.contains("is-active")){ location.hash = "#edward"; return; }
        if(views.edward.classList.contains("is-active")){ location.hash = "#shap-ters"; return; }
        if(views.cart.classList.contains("is-active")){ location.hash = lastNonCart || "#face"; return; }

        // In face: if we're already inside shap-ters slide, go to top
        scrollToFaceTop();
        replaceHash("#face");
        setCurrentNav("face");
        updateStatus("face");
      }

      // Nav highlight
      function setCurrentNav(key){
        btnFace.setAttribute("aria-current", key === "face" ? "true" : "false");
        btnSh.setAttribute("aria-current", (key === "shapters" || key === "edward" || key === "product") ? "true" : "false");
        btnCart.setAttribute("aria-current", key === "cart" ? "true" : "false");
      }

      function updateStatus(key){
        if(key === "face"){
          statusLeft.textContent = faceCount ? ("face: " + faceCount + " frames") : "face";
          return;
        }
        if(key === "shapters"){ statusLeft.textContent = "shap-ters"; return; }
        if(key === "edward"){ statusLeft.textContent = "Edward Phillips"; return; }
        if(key === "product"){ statusLeft.textContent = "specimen"; return; }
        if(key === "cart"){ statusLeft.textContent = "cart"; return; }
        statusLeft.textContent = "ready";
      }

      // View switch
      function showView(key){
        Object.values(views).forEach(v => v.classList.remove("is-active"));

        // shap-ters is embedded inside face
        const actual = (key === "shapters") ? "face" : key;
        views[actual].classList.add("is-active");

        setCurrentNav(key);
        updateStatus(key);
      }

      // Routing
      function parseHash(){
        const h = (location.hash || "#face").replace(/^#/, "");
        const parts = h.split("/").filter(Boolean);
        let root = parts[0] || "face";
        if(root === "shapters") root = "shap-ters";
        return { root, parts };
      }

      function route(){
        const { root, parts } = parseHash();
        if(root !== "cart") lastNonCart = location.hash || "#face";

        if(root === "face"){
          showView("face");
          scrollToFaceTop();
          return;
        }
        if(root === "shap-ters"){
          showView("shapters");
          scrollToEmbeddedShapters();
          return;
        }
        if(root === "edward"){
          showView("edward");
          return;
        }
        if(root === "product"){
          const id = parts[1] || "";
          const item = DB.products.find(p => p.id === id);
          if(!item){ location.hash = "#edward"; return; }
          renderProduct(item);
          showView("product");
          return;
        }
        if(root === "cart"){
          renderCart();
          showView("cart");
          return;
        }
        location.hash = "#face";
      }

      // Header events
      if(btnBack) btnBack.addEventListener("click", goBack);

      brandHome.addEventListener("click", (e)=>{
        e.preventDefault();
        navigateTo("#face");
      });

      btnFace.addEventListener("click", ()=>navigateTo("#face"));
      btnSh.addEventListener("click", ()=>navigateTo("#shap-ters"));
      btnCart.addEventListener("click", ()=>navigateTo("#cart"));

      // Internal nav
      goEdward.addEventListener("click", ()=>navigateTo("#edward"));
      backToShapters.addEventListener("click", ()=>navigateTo("#shap-ters"));

      prodBack.addEventListener("click", goBack);

      cartBack.addEventListener("click", goBack);
      cartClear.addEventListener("click", ()=>{ clearCart(); renderCart(); });

      // Keyboard shortcuts (global, no per-photo navigation)
      window.addEventListener("keydown", (e)=>{
        const key = e.key;
        const el = document.activeElement;
        const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
        if(typing) return;

        if(key === "Escape"){ goBack(); return; }
        if(key === "1"){ navigateTo("#face"); return; }
        if(key === "2"){ navigateTo("#shap-ters"); return; }
        if(key === "3"){ navigateTo("#cart"); return; }
      });

      // Sync topbar + hash with scroll inside face (face vs shap-ters)
      let embeddedKey = "face";
      function setEmbeddedKey(next){
        if(embeddedKey === next) return;
        embeddedKey = next;

        if(!views.face.classList.contains("is-active")) return;

        if(next === "shapters"){
          setCurrentNav("shapters");
          updateStatus("shapters");
          replaceHash("#shap-ters");
        }else{
          setCurrentNav("face");
          updateStatus("face");
          replaceHash("#face");
        }
      }

      function setupEmbeddedSync(){
        const node = document.getElementById("slide-shapters");
        if(!node) return;

        const io = new IntersectionObserver((entries)=>{
          if(!views.face.classList.contains("is-active")) return;
          const e = entries[0];

          // Hysteresis to avoid flicker
          if(e.isIntersecting && e.intersectionRatio >= 0.45){
            setEmbeddedKey("shapters");
          }else if(!e.isIntersecting || e.intersectionRatio <= 0.20){
            setEmbeddedKey("face");
          }
        }, { root: faceSlides, threshold: [0, 0.20, 0.45, 0.70] });

        io.observe(node);
      }

      // Face gallery builder
      function pad2(n){ return String(n).padStart(2,"0"); }
      async function probeImage(url){
        return new Promise((resolve)=>{
          const img = new Image();
          img.decoding = "async";
          img.onload = ()=>resolve(true);
          img.onerror = ()=>resolve(false);
          img.src = url + "?v=" + Date.now();
        });
      }

      async function loadFaceGallery(){
        const base = "assets/img/face/";
        const maxTry = 80;

        statusLeft.textContent = "face: scanning";
        const found = [];

        for(let i=1; i<=maxTry; i++){
          const file = "face_" + pad2(i) + ".png";
          const url = base + file;
          const ok = await probeImage(url);

          if(!ok){
            if(found.length > 0) break;
            if(i < 6) continue;
            break;
          }
          found.push({ url: base + file, idx: i });
        }

        faceSlides.querySelectorAll(".slide[data-kind='face']").forEach(n=>n.remove());

        if(found.length === 0){
          faceCount = 0;
          updateStatus("face");

          const s = document.createElement("div");
          s.className = "slide";
          s.setAttribute("data-kind","face");
          s.innerHTML = `
            <div class="badge">
              <p class="t goth">face</p>
              <p class="m"><span>missing assets/img/face/face_01.png</span></p>
            </div>
          `;
          faceSlides.insertBefore(s, document.getElementById("slide-shapters") || null);
          return;
        }

        const frag = document.createDocumentFragment();
        found.forEach((it)=>{
          const slide = document.createElement("section");
          slide.className = "slide";
          slide.setAttribute("data-kind","face");
          slide.setAttribute("aria-label", "face");

          const img = document.createElement("img");
          img.alt = "face_" + pad2(it.idx);
          img.src = it.url;
          img.draggable = false;

          const badge = document.createElement("div");
          badge.className = "badge";
          badge.innerHTML = `
            <p class="t goth">face</p>
            <p class="m"><span>${img.alt}</span></p>
          `;

          slide.appendChild(img);
          slide.appendChild(badge);
          frag.appendChild(slide);
        });

        const anchor = document.getElementById("slide-shapters");
        if(anchor){ faceSlides.insertBefore(frag, anchor); } else { faceSlides.appendChild(frag); }

        faceCount = found.length;
        if(embeddedKey === "face") updateStatus("face");
      }

      // Edward catalog render
      function renderEdwardCatalog(){
        edwardProducts.innerHTML = "";
        const frag = document.createDocumentFragment();

        DB.products.forEach((p)=>{
          const card = document.createElement("article");
          card.className = "product";
          card.setAttribute("role", "button");
          card.tabIndex = 0;

          const firstImg = p.images[0] || "";
          const price = moneyUSD(p.priceUSD);

          card.innerHTML = `
            <div class="thumb">
              <img src="${firstImg}" alt="${escapeHtml(p.title)}">
              <div class="thumb-veil" aria-hidden="true"></div>

              <div class="runes" aria-hidden="true">
                <span class="rune goth">${price}</span>
                <span class="rune goth ${p.inStock ? "" : "dark"}">${p.inStock ? "in stock" : "sold out"}</span>
              </div>

              <span class="stamp goth ${p.inStock ? "" : "sold"}">${p.inStock ? "catalog" : "sold"}</span>
            </div>

            <div class="info">
              <div class="stack">
                <h4 class="goth">${escapeHtml(p.title)}</h4>
                <p class="meta">
                  <span class="chip">${p.images.length} frames</span>
                  <span class="chip">owner: edp</span>
                </p>
              </div>

              <div class="card-actions" aria-hidden="true">
                <span class="seal goth">open</span>
                <span class="dbmark">db: ${escapeHtml((p.dbId || "").slice(0, 12) || "local")}</span>
              </div>
            </div>
          `;

          function go(){ navigateTo("#product/" + encodeURIComponent(p.id)); }
          card.addEventListener("click", go);
          card.addEventListener("keydown", (e)=>{ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });

          frag.appendChild(card);
        });

        edwardProducts.appendChild(frag);
      }

      // Product view render
      function renderProduct(item){
        prodTitle.textContent = item.title;
        const price = moneyUSD(item.priceUSD);
        const stock = item.inStock ? "in stock" : "sold out";

        prodMeta.innerHTML = `
          <span class="chip">${price}</span>
          <span class="chip ${item.inStock ? "" : "sold"}">${stock}</span>
          <span class="chip">${item.images.length} frames</span>
        `;

        prodGallery.innerHTML = "";
        const frag = document.createDocumentFragment();
        item.images.forEach((src)=>{
          const cell = document.createElement("div");
          cell.className = "shot";
          cell.innerHTML = `<img src="${src}" alt="${escapeHtml(item.title)}">`;
          frag.appendChild(cell);
        });
        prodGallery.appendChild(frag);

        prodToCart.onclick = () => {
          addToCart(item);
          navigateTo("#cart");
        };
      }

      // Cart render
      function renderCart(){
        const cart = readCart();
        cartList.innerHTML = "";

        let total = 0;
        cart.forEach(it => total += (Number(it.priceUSD) || 0));
        cartTotal.textContent = moneyUSD(total);

        if(cart.length === 0){
          const empty = document.createElement("div");
          empty.className = "row";
          empty.innerHTML = `
            <div>
              <p class="nm goth">empty</p>
              <p class="sm"><span>no specimens</span></p>
            </div>
            <div class="right">
              <button class="tiny goth" type="button" id="goToCatalogBtn">catalog</button>
            </div>
          `;
          cartList.appendChild(empty);
          empty.querySelector("#goToCatalogBtn").addEventListener("click", ()=>navigateTo("#edward"));
          return;
        }

        cart.forEach((it)=>{
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            <div>
              <p class="nm goth">${escapeHtml(it.title)}</p>
              <p class="sm">
                <span>${moneyUSD(it.priceUSD)}</span>
                <span>${it.inStock ? "in stock" : "sold out"}</span>
                <span>id: ${escapeHtml(it.id)}</span>
              </p>
            </div>
            <div class="right">
              <button class="tiny goth" type="button" data-open="${escapeHtml(it.id)}">open</button>
              <button class="tiny danger goth" type="button" data-remove="${escapeHtml(it.id)}">remove</button>
            </div>
          `;
          cartList.appendChild(row);
        });

        cartList.querySelectorAll("[data-remove]").forEach((b)=>{
          b.addEventListener("click", ()=>{
            removeFromCart(b.getAttribute("data-remove"));
            renderCart();
          });
        });
        cartList.querySelectorAll("[data-open]").forEach((b)=>{
          b.addEventListener("click", ()=>{
            const id = b.getAttribute("data-open");
            navigateTo("#product/" + encodeURIComponent(id));
          });
        });
      }

      function escapeHtml(s){
        return String(s)
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#39;");
      }

      // Init
      loadFaceGallery();
      renderEdwardCatalog();
      setupEmbeddedSync();

      window.addEventListener("hashchange", route);
      if(!location.hash) location.hash = "#face";
      route();
    })();
  </script>
</body>
</html>
