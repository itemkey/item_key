 }
 function replaceHash(hash){

 function scrollToFaceTop(behavior){

 });

 }
 function scrollToEmbeddedShapters(behavior){

 function navigateTo(hash){

 if(views.edward.classList.contains("is-active") || views.unregistered.classList.contains("is-active")){ location.hash = "#shap-ters"; return; }
 if(views.cart.classList.contains("is-active")){ location.hash = lastNonCart || "#face"; return; }

 // Routing
 function parseHash(){
 const h = (location.hash || "#face").replace(/^#/, "");
 const parts = h.split("/").filter(Boolean);
 let root = parts[0] || "face";
 if(root === "shapters") root = "shap-ters";

 // Face gallery builder (progressive, no "empty screen while scanning")
 function pad2(n){ return String(n).padStart(2,"0"); }
 function makeFaceSlide(url, idx){
 const slide = document.createElement("section");
 slide.className = "slide";
 slide.setAttribute("data-kind","face");
 slide.setAttribute("aria-label", "face");
 const img = document.createElement("img");

 img.addEventListener("load", ()=>{ img.classList.add("is-loaded"); }, { once:true });
 img.addEventListener("error", ()=>{ img.classList.add("is-loaded"); }, { once:true });
 img.loading = (idx <= 2) ? "eager" : "lazy";
 if (idx === 1) img.fetchPriority = "high";

 badge.className = "badge";
 badge.innerHTML = `

 function probeImage(url){

 // --- IMAGE LOADING HELPERS ---
 const BLANK_SVG = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="2" height="2"><rect width="100%" height="100%" fill="white"/></svg>');
 function enhanceImg(img){
 if(!img) return;
 if(!img.classList.contains("img-fade")) img.classList.add("img-fade");
 if(img.complete && img.naturalWidth > 0){
 img.classList.add("is-loaded");
 }else{
 img.addEventListener("load", ()=>img.classList.add("is-loaded"), { once:true });
 img.addEventListener("error", ()=>img.classList.add("is-loaded"), { once:true });
 }
 }
 function lazyBindImages(rootEl, opts){
 const root = (opts && opts.root) || null;
 const rootMargin = (opts && opts.rootMargin) || "700px 0px";
 const selector = (opts && opts.selector) || "img[data-src]";
 const imgs = Array.from((rootEl || document).querySelectorAll(selector));
 if(!imgs.length) return;
 if(!("IntersectionObserver" in window)){
 imgs.forEach(img=>{
 const src = img.getAttribute("data-src");
 if(src){ img.src = src; img.removeAttribute("data-src"); }
 enhanceImg(img);
 });
 return;
 }
 const io = new IntersectionObserver((entries)=>{
 entries.forEach(e=>{
 if(!e.isIntersecting) return;
 const img = e.target;
 io.unobserve(img);
 const src = img.getAttribute("data-src");
 if(src){
 img.src = src;
 img.removeAttribute("data-src");
 }
 enhanceImg(img);
 });
 }, { root, rootMargin, threshold: 0.01 });
 imgs.forEach(img=>{
 enhanceImg(img);
 io.observe(img);
 });
 }
 async function loadFaceGallery(){
 const base = "assets/img/face/";
 const maxTry = 80;
 // Keep the first face frame that is already in HTML for instant paint
 const first = document.getElementById("faceFirst");
 // Remove old generated face slides, but keep #faceFirst if present
 faceSlides.querySelectorAll(".slide[data-kind='face']").forEach(n=>{
 if(first && n === first) return;
 n.remove();
 });
 // If the first frame exists, it counts as ready content immediately
 faceCount = first ? 1 : 0;
 faceReady = !!first;
 updateStatus("face");
 faceCount = 0;
 faceReady = false;
 updateStatus("face");
 // Always stay at the top while first frames are appearing
 scrollToFaceTop("auto");
 const found = [];
 for(let i=(first?2:1); i<=maxTry; i++){
 const file = "face_" + pad2(i) + ".png";
 const url = base + file;
 const ok = await probeImage(url);
 if(!ok){
 if(found.length > 0) break;
 if(i < 6) continue;
 break;
 }
 found.push({ url, idx: i });
 // Add slides progressively
 if(found.length === 1 && !first){
 const firstSlide = makeFaceSlide(url, i);
 const shAnchor = document.getElementById("slide-shapters");
 if(shAnchor){ faceSlides.insertBefore(firstSlide, shAnchor); } else { faceSlides.appendChild(firstSlide); }
 requestAnimationFrame(()=>{ glitchLogoOn(firstSlide, { durationMs: 1000 }); });
 faceReady = true;
 faceCount = 1;
 updateStatus("face");
 scrollToFaceTop("auto");
 }else{
 const slide = makeFaceSlide(url, i);
 const shAnchor = document.getElementById("slide-shapters");
 if(shAnchor){ faceSlides.insertBefore(slide, shAnchor); } else { faceSlides.appendChild(slide); }
 faceCount = (first ? (1 + found.length) : found.length);
 faceReady = true;
 updateStatus("face");
 }
 }
 // No additional images found (keep #faceFirst if present)
 if(found.length === 0 && !first){
 faceReady = true;
 faceCount = 0;
 updateStatus("face");
 scrollToFaceTop("auto");
 return;
 }
 // Ensure we are exactly at top once scanning is done
 scrollToFaceTop("auto");
 }
