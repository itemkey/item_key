<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Item Key — item-user</title>
  <script>
    (function() {
      var key = "ik_site_theme_v1";
      var stored = null;
      try { stored = localStorage.getItem(key); } catch (e) {}
      var theme = (stored === "dark" || stored === "light")
        ? stored
        : ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body class="page page-user ik-auth-pending" data-ik-loading>
  <header class="topbar topbar--edge">
    <a class="toplink" href="index.html">
      <span class="tag">item-key</span>
    </a>
  </header>

  <main class="center-stage">

    <!-- ГОСТЬ -->
    <section id="authGuest" class="auth-box" data-ik-stage="hero">
      <h1>item-user</h1>
      <p class="muted">доступ к архиву</p>

      <div class="auth-tabs">
        <button data-tab="login" class="auth-tab is-active" type="button">вход</button>
        <button data-tab="register" class="auth-tab" type="button">регистрация</button>
      </div>

      <!-- ВХОД -->
      <form id="loginForm" class="auth-form">
        <input required type="email" placeholder="почта" id="loginName" autocomplete="email">
        <input required type="password" placeholder="пароль" id="loginPass">
        <button class="btn btn--primary" type="submit">войти</button>
      </form>

      <!-- РЕГИСТРАЦИЯ -->
      <form id="registerForm" class="auth-form hidden">
        <input required type="text" placeholder="user-id (уникальный)" id="regUserId" minlength="4" maxlength="32" autocomplete="off">
        <input required type="text" placeholder="ник" id="regNick" maxlength="48" autocomplete="nickname">
        <input required type="email" placeholder="почта" id="regEmail">
        <input required type="password" placeholder="пароль" id="regPass">
        <p class="muted auth-tip">user-id нужен для друзей. допустимо: латиница, цифры, <code>.</code> <code>_</code> <code>-</code></p>
        <button class="btn btn--primary" type="submit">создать аккаунт</button>
      </form>
    </section>

    <!-- ЛК -->
    <section id="authWorkspace" class="auth-box account-center hidden" data-ik-stage="content">
      <h1>account center</h1>
      <p class="muted">управление профилем и друзьями</p>

      <div class="auth-tabs auth-tabs--workspace">
        <button data-view="profile" class="auth-tab auth-view-tab profile-tab is-active" type="button">My profile</button>
        <button data-view="friends" class="auth-tab auth-view-tab" type="button">friends</button>
      </div>

      <div id="profileView" class="user-view">
        <section class="profile-showcase" aria-label="витрина профиля">
          <div class="profile-showcase__avatar" aria-hidden="true" id="profileShowcaseAvatar">IK</div>
          <div class="profile-showcase__info">
            <div class="profile-showcase__name" id="profileShowcaseName">user</div>
            <div class="profile-showcase__id">
              <span class="profile-showcase__label">user-id</span>
              <button class="profile-showcase__value profile-copy-trigger" id="profileShowcaseUserId" type="button">user_id</button>
            </div>
            <p class="profile-showcase__bio" id="profileShowcaseBio">—</p>
          </div>
        </section>

        <section class="profile-stats" aria-label="статистика аккаунта">
          <div class="profile-stat">
            <div class="profile-stat__label">EKO</div>
            <div class="profile-stat__value" id="profileStatExp">0</div>
          </div>
          <div class="profile-stat profile-stat--cash">
            <div class="profile-stat__label">I-bit þ</div>
            <div class="profile-stat__value" id="profileStatCash">0</div>
          </div>
        </section>

        <button id="constructorToggle" class="btn" type="button">конструктор</button>

        <section id="constructorPanel" class="constructor-panel hidden" aria-label="конструктор аккаунта">
          <div class="profile-avatar-row">
            <div class="profile-avatar" id="profileAvatarPreview" aria-label="avatar">IK</div>
            <label class="btn profile-avatar-upload" for="profileAvatarInput">
              сменить аватар
            </label>
            <input class="visually-hidden" type="file" id="profileAvatarInput" accept="image/*">
          </div>
          <form id="profileForm" class="auth-form constructor-form">
            <div class="profile-field">
              <label for="profileNick">ник</label>
              <input required type="text" placeholder="ник" id="profileNick" maxlength="48">
            </div>
            <div class="profile-field">
              <label for="profileUserId">user-id</label>
              <input required type="text" placeholder="user-id" id="profileUserId" minlength="4" maxlength="32" autocomplete="off">
            </div>
            <div class="profile-field">
              <label for="profileBio">описание</label>
              <textarea id="profileBio" placeholder="описание профиля" rows="4" maxlength="280"></textarea>
            </div>
            <button class="btn btn--primary" type="submit">сохранить профиль</button>
          </form>
          <div class="constructor-line"><b>почта:</b> <span id="constructorEmail">-</span></div>
          <div class="constructor-line"><b>пароль:</b> <span id="constructorMaskedPassword">********</span></div>

          <form id="emailChangeForm" class="auth-form constructor-form">
            <input required type="password" id="emailCurrentPass" placeholder="текущий пароль (проверка)">
            <input required type="email" id="emailNewValue" placeholder="новая почта">
            <button class="btn" type="submit">сменить почту</button>
          </form>

          <form id="passwordChangeForm" class="auth-form constructor-form">
            <input required type="password" id="passwordCurrentPass" placeholder="текущий пароль (проверка)">
            <input required type="password" id="passwordNewValue" placeholder="новый пароль">
            <input required type="password" id="passwordRepeatValue" placeholder="повтори новый пароль">
            <button class="btn" type="submit">сменить пароль</button>
          </form>
        </section>

        <button id="logoutBtn" class="btn" type="button">выйти</button>
      </div>

      <div id="friendsView" class="user-view hidden">
        <form id="addFriendForm" class="auth-form">
          <input required type="text" id="addFriendUserId" placeholder="user-id друга" minlength="4" maxlength="32" autocomplete="off">
          <button class="btn btn--primary" type="submit">add friend</button>
        </form>

        <button id="friendsRefreshBtn" class="btn" type="button">обновить</button>

        <section class="friends-block">
          <h2 class="friends-title">входящие приглашения</h2>
          <div id="incomingRequestsList" class="friends-list"></div>
        </section>

        <section class="friends-block">
          <h2 class="friends-title">исходящие приглашения</h2>
          <div id="outgoingRequestsList" class="friends-list"></div>
        </section>

        <section class="friends-block">
          <h2 class="friends-title">друзья</h2>
          <div id="friendsList" class="friends-list"></div>
        </section>
      </div>
    </section>

  </main>

  <script>
    // =========================
    // NAV: return link depends on where user came from
    // Reads ?returnTo / ?from, then falls back to session/localStorage keys
    // =========================
    (() => {
      const link = document.querySelector("header .toplink");
      if (!link) return;
      const tag = link.querySelector(".tag");

      const params = new URLSearchParams(location.search);
      const ownPath = String(location.pathname || "").replace(/^\/+/, "");
      const appRoot = ownPath.includes("/") ? ownPath.split("/").slice(0, -1).join("/") : "";

      const getRefPath = () => {
        const ref = document.referrer || "";
        if (!ref) return null;
        try {
          const u = new URL(ref);
          const path = String(u.pathname || "").replace(/^\/+/, "");
          return path || null;
        } catch (e) {
          // fallback if referrer isn't a valid absolute URL
          const path = String(ref).split("?")[0].split("#")[0].replace(/^\/+/, "");
          return path || null;
        }
      };

      const refPath = getRefPath();

      // Priority:
      // 1) explicit query (?returnTo / ?from)
      // 2) real referrer page (when you clicked сюда из другой вкладки)
      // 3) saved storage values (for edge cases like reloads)
      const candidate =
        params.get("returnTo") ||
        params.get("from") ||
        (refPath && !/item-user\.html$/i.test(refPath) ? refPath : null) ||
        sessionStorage.getItem("itemkey.user.returnTo") ||
        localStorage.getItem("itemkey.user.returnTo") ||
        localStorage.getItem("itemkey.lastPage") ||
        localStorage.getItem("itemkey.returnTo") ||
        localStorage.getItem("itemkey.prevPage") ||
        localStorage.getItem("itemkey.nav.return") ||
        localStorage.getItem("itemkey.user.from") ||
        "index.html";

      const safePath = (v) => {
        if (!v) return null;
        let clean = String(v)
          .split("?")[0]
          .split("#")[0]
          .replace(/\\/g, "/")
          .replace(/^\/+/, "")
          .trim();
        if (appRoot && clean.toLowerCase().startsWith((appRoot + "/").toLowerCase())) {
          clean = clean.slice(appRoot.length + 1);
        }
        if (!clean || clean.includes("..")) return null;
        if (!/^[a-z0-9_./\-]+\.html$/i.test(clean)) return null;
        if (/item-user\.html$/i.test(clean)) return null;
        return clean;
      };

      const dest = safePath(candidate) || "index.html";
      link.href = dest;
       // keep last origin in storage (helps when referrer is empty on file://)
       try { sessionStorage.setItem("itemkey.user.returnTo", dest); } catch(e) {}
       try { localStorage.setItem("itemkey.user.returnTo", dest); } catch(e) {}


      const label =
        dest.toLowerCase() === "index.html"
          ? "item-key"
          : dest.split("/").pop().replace(/\.html$/i, "");

      if (tag) tag.textContent = label;
      link.setAttribute("aria-label", `back to ${label}`);
    })();
  </script>
  <script src="assets/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
